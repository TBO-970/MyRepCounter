<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Rep Log"><meta name="theme-color" content="#07090a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style><title>Rep Log</title>

<style>
:root{
  /* Layout: phone-first app shell. Four scrolling tab views, full-screen sheets for the workout editor and exercise picker, rest timer docked at the bottom. Single dark look to match the reference app. */
  --bg:#07090a; --surface:#15191b; --surface-2:#1f2427; --line:#2a3135; --fg:#f1f5f6; --muted:#8a949a;
  --accent:#2cc8d8; --accent-ink:#04171a; --good:#4cc38a; --warn:#f0b04a; --danger:#ef6461;
  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --font-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --pl:max(16px,env(safe-area-inset-left,0px),calc((100% - 560px)/2));
  --pr:max(16px,env(safe-area-inset-right,0px),calc((100% - 560px)/2));
  color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 var(--font-ui);padding-block:0;padding-left:var(--pl);padding-right:var(--pr);-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,textarea,select{font:inherit;color:inherit;background:transparent;border:0;outline:0;min-width:0;border-radius:0}
textarea{resize:none;width:100%;padding:12px 0;line-height:1.4}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
svg{display:block}
small,.mut{color:var(--muted)}
.dng{color:var(--danger)}

main{padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:52px}
.lnk{color:var(--accent);font-weight:500;font-size:17px;min-height:44px;padding:0 6px;display:inline-flex;align-items:center}
.lnk.strong{font-weight:700}
.ib{width:44px;height:44px;display:grid;place-items:center;color:var(--accent);flex:none}
h1.big{font-size:34px;font-weight:800;letter-spacing:-.02em;margin:2px 0 16px}
h2.sec{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.09em;margin:26px 2px 10px;font-weight:700}
.card{background:var(--surface);border-radius:14px}
.btn{height:48px;border-radius:12px;background:var(--surface-2);font-weight:600;padding:0 18px;width:100%;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--danger)}
.btn.sm{height:38px;font-size:14px;width:auto;padding:0 14px}
.stack{display:flex;flex-direction:column;gap:10px}
.banner{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:12px;background:var(--surface);margin-bottom:12px;width:100%;font-size:14px}
.banner.resume{border:1px solid var(--accent)}
.empty{padding:36px 8px;text-align:center;color:var(--muted)}

/* Log */
.mh{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;margin:20px 2px 10px}
.wk{display:flex;gap:14px;padding:14px;margin-bottom:12px;position:relative;cursor:pointer}
.date{width:46px;flex:none;border-radius:9px;overflow:hidden;text-align:center;align-self:flex-start;background:var(--surface-2)}
.date span{display:block;font-size:12px;font-weight:700;color:var(--muted);background:#2b3236;padding:2px 0}
.date b{display:block;font-size:22px;line-height:1.1;padding:3px 0 5px}
.wb{flex:1;min-width:0}
.wt{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.wt h3{margin:0;font-size:19px;font-weight:700}
.wt span{color:var(--muted);white-space:nowrap}
.wb ul{list-style:none;margin:6px 0 0;padding:0}
.wb li{padding:1px 0;overflow-wrap:anywhere}
.del{width:28px;height:28px;border-radius:50%;background:var(--danger);color:#fff;display:grid;place-items:center;flex:none;align-self:center}

/* Overlays */
.ov{position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-left:var(--pl);padding-right:var(--pr);z-index:30}
#picker{z-index:40}
.obar{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;min-height:52px;flex:none}
.obar h2{margin:0;font-size:17px;font-weight:700;text-align:center;white-space:nowrap}
.oleft{display:flex;align-items:center}
.oright{display:flex;align-items:center;justify-content:flex-end}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:8px 0 calc(150px + env(safe-area-inset-bottom,0px))}
.rows .row{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;padding:0 16px;border-bottom:1px solid var(--line)}
.rows .row:last-child{border-bottom:0}
.row .grow{flex:1;text-align:left;height:48px}
.row .inl{display:flex;align-items:center;gap:6px}
.row .short{width:70px;text-align:right}
.row input[type=datetime-local]{text-align:right;color:var(--fg);max-width:60%}
.addrow{width:100%;height:50px;margin-top:14px;color:var(--accent);font-weight:600;font-size:16px;text-align:left;padding:0 16px;display:block}
.ex{padding:12px 12px 6px;margin-top:14px}
.ex.ss{border-left:3px solid var(--accent)}
.ex.ss-cont{margin-top:2px;border-top-left-radius:0;border-top-right-radius:0}
.ex.ss-more{border-bottom-left-radius:0;border-bottom-right-radius:0}
.sslabel{font:700 11px var(--font-ui);letter-spacing:.09em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.exh{display:flex;align-items:center;gap:8px}
.exname{flex:1;min-width:0;font-weight:700;color:var(--accent);font-size:17px;overflow-wrap:anywhere}
.grp{color:var(--muted);font-size:12px}
.sh,.set{display:grid;grid-template-columns:34px 1fr 70px 70px 40px;gap:8px;align-items:center}
.sh{color:var(--muted);font:700 10px var(--font-ui);letter-spacing:.08em;text-align:center;margin:8px 0 2px}
.set{padding:4px 6px;margin:2px -6px;border-radius:10px;background:rgba(44,200,216,0)}
.set.done{background:rgba(44,200,216,.14)}
@supports (background:color-mix(in srgb,red 10%,blue)){.set.done{background:color-mix(in srgb,var(--accent) 14%,var(--surface))}}
.sn{width:32px;height:32px;border-radius:8px;background:var(--surface-2);font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.sn.drop{color:var(--warn)}
.prev{color:var(--muted);font-size:13px;display:flex;flex-direction:column;align-items:center;gap:2px;font-variant-numeric:tabular-nums;min-width:0}
.pr{font:800 9px var(--font-ui);letter-spacing:.07em;color:var(--accent-ink);background:var(--warn);border-radius:4px;padding:1px 5px}
.num{height:36px;border-radius:8px;background:var(--surface-2);text-align:center;font-weight:600;font-variant-numeric:tabular-nums;width:100%}
.chk{width:36px;height:36px;border-radius:8px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.set.done .chk{background:var(--accent);color:var(--accent-ink)}
.addset{width:100%;height:42px;color:var(--accent);font-weight:600;text-align:center}
.ritem{padding:12px 14px;margin-top:10px;display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.ritem.ss{border-left:3px solid var(--accent)}
.rname{display:flex;flex-direction:column;min-width:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper>button:not(.ib){width:34px;height:34px;border-radius:8px;background:var(--surface-2);font-size:20px;text-align:center}
.stepper span{min-width:58px;text-align:center;font-variant-numeric:tabular-nums}

/* Picker */
.search{display:flex;align-items:center;gap:8px;background:var(--surface-2);border-radius:12px;padding:0 12px;height:44px;margin:4px 0 8px;color:var(--muted)}
.search input{flex:1;color:var(--fg)}
.li{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:54px;border-bottom:1px solid var(--line);font-size:17px;width:100%}
.li small{display:block;font-size:12px}
.li .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;flex:none;color:var(--accent-ink)}
.li .tick.on{background:var(--accent);border-color:var(--accent)}
.pkfoot{position:absolute;left:0;right:0;bottom:0;padding:10px var(--pr) calc(12px + env(safe-area-inset-bottom,0px)) var(--pl);display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(transparent,var(--bg) 30%)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px}
.seg button{padding:7px 14px;border-radius:8px;font-weight:600;font-size:14px;color:var(--fg);text-align:center}
.seg button[aria-pressed=true]{background:#485056}

/* Modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.panel{width:100%;max-width:560px;background:var(--surface);border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:10px}
.panel h3{margin:0 0 4px;font-size:18px}
.panel .opt{height:52px;display:flex;align-items:center;border-radius:12px;background:var(--surface-2);padding:0 16px;font-weight:600;width:100%}
.panel textarea.out{background:var(--surface-2);border-radius:10px;padding:12px;height:180px;font:12px/1.4 var(--font-num);width:100%}
.panel input.fld,.panel select.fld{background:var(--surface-2);border-radius:10px;height:46px;padding:0 12px;width:100%}
.hist{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums}
.hist span:last-child{text-align:right;color:var(--muted)}

/* Timer */
#timer{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-top:1px solid var(--line);padding:10px var(--pr) calc(10px + env(safe-area-inset-bottom,0px)) var(--pl)}
.tin{display:flex;align-items:center;justify-content:space-between;gap:8px}
.td{font:700 38px/1 var(--font-num);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.td.zero{color:var(--warn)}
.tp{width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.tn{height:36px;padding:0 10px;border-radius:8px;background:var(--surface-2);color:var(--muted);font-weight:700;text-align:center;flex:none}
.tx{width:36px;height:36px;border-radius:50%;background:#e9eef0;color:#111;display:grid;place-items:center;flex:none}

/* Tabs and toast */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(21,25,27,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:6px var(--pr) calc(6px + env(safe-area-inset-bottom,0px)) var(--pl);z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;font-weight:600;padding:6px 0;text-align:center}
.tab[aria-selected=true]{color:var(--accent)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom,0px));background:#e9eef0;color:#111;padding:10px 16px;border-radius:999px;font-weight:600;z-index:70;font-size:14px;max-width:90vw;text-align:center}

/* Stats and profile */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{padding:12px 14px}
.tile b{display:block;font-size:24px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.tile span{color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.chart{padding:12px 10px 6px}
.chart svg{width:100%;height:auto}
.bar{fill:var(--accent);opacity:.5}
.bar.last{opacity:1}
.grid{stroke:var(--line);stroke-width:1}
.ax{fill:var(--muted);font:10px var(--font-ui)}
.ln{fill:none;stroke:var(--accent);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.area{fill:var(--accent);opacity:.13}
.dot{fill:var(--bg);stroke:var(--accent);stroke-width:2}
.dot.last{fill:var(--accent)}
.val{fill:var(--fg);font:700 11px var(--font-ui)}
.sel{background:var(--surface-2);border-radius:10px;padding:0 12px;height:44px;width:100%;color:var(--fg)}
.prrow{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:baseline}
.prrow:last-child{border-bottom:0}
.prrow b{font-weight:600}
.prrow span{color:var(--muted);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
.line2{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);min-height:52px}
.line2:last-child{border-bottom:0}
.inrow{display:flex;gap:10px}
.inrow input{flex:1;background:var(--surface-2);border-radius:10px;height:46px;padding:0 12px}
.inrow .btn{width:auto}
@media (prefers-reduced-motion:no-preference){.btn,.tab,.chk,.set{transition:background .15s,color .15s}}
</style>
</head><body>
<div id="app"><main id="view"></main></div>
<nav class="tabs" id="tabs" role="tablist" aria-label="Sections"></nav>
<div id="sheet" class="ov" hidden></div>
<div id="picker" class="ov" hidden></div>
<div id="timer" hidden></div>
<div id="modal" class="scrim" data-act="modal-close" hidden></div>
<div id="toast" role="status" hidden></div>
<script>
(()=>{'use strict';
/* ---------- helpers ---------- */
const $=(s,r=document)=>r.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const DAY=864e5;
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const DOW=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const pad=n=>String(n).padStart(2,'0');
const slug=s=>s.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const fmtShort=t=>{const d=new Date(t);return MON[d.getMonth()]+' '+d.getDate();};
const fmtMonth=t=>{const d=new Date(t);return MON[d.getMonth()]+' '+d.getFullYear();};
const fmtTime=t=>{const d=new Date(t);const h=d.getHours();return (h%12||12)+':'+pad(d.getMinutes())+' '+(h<12?'AM':'PM');};
const fmtDur=ms=>{const m=Math.round(ms/60000);return m>=60?Math.floor(m/60)+'h '+pad(m%60)+'m':m+' min';};
const fmtN=n=>{n=Number(n);return String(Math.round(n*100)/100);};
const kfmt=n=>n>=1000?(Math.round(n/100)/10)+'k':String(Math.round(n*10)/10);
const mmss=n=>pad(Math.floor(n/60))+':'+pad(n%60);
const toLocalInput=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());};
const weekStart=t=>{const d=new Date(t);d.setHours(0,0,0,0);d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime();};
const addWeeks=(t,n)=>{const d=new Date(t);d.setDate(d.getDate()+7*n);return d.getTime();};
const ICONS={
log:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
dumbbell:'<path d="M6.5 6.5v11M17.5 6.5v11M3 9v6M21 9v6M6.5 12h11"/>',
bars:'<path d="M6 20V11M12 20V4M18 20v-6"/>',
person:'<circle cx="12" cy="8" r="4"/><path d="M4 21c0-4.4 3.6-7 8-7s8 2.6 8 7"/>',
plus:'<path d="M12 5v14M5 12h14"/>',
down:'<path d="M6 9l6 6 6-6"/>',
alarm:'<circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M4 5l3-2M20 5l-3-2"/>',
dots:'<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>',
trash:'<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
x:'<path d="M6 6l12 12M18 6L6 18"/>',
play:'<path d="M8 5l11 7-11 7z" fill="currentColor"/>',
pause:'<path d="M8 5v14M16 5v14" stroke-width="3.2"/>',
search:'<circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/>',
right:'<path d="M9 6l6 6-6 6"/>',
left:'<path d="M15 6l-6 6 6 6"/>',
minus:'<path d="M5 12h14"/>'};
const ic=(n,s=22)=>'<svg viewBox="0 0 24 24" width="'+s+'" height="'+s+'" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICONS[n]+'</svg>';

/* ---------- data ---------- */
const LIB=[
['Abs',['Crunch','Hanging leg raise','Cable crunch','Plank','Ab wheel rollout']],
['Back',['Deadlift','Pulldowns','Machine row','Chest supported row','Barbell row','Seated cable row','Pull up','Rear delt pull']],
['Biceps',['Barbell curl','Dumbbell curl','Close grip cable curl','Hammer curl','Preacher curl']],
['Cardio',['Treadmill','Cycling','Rowing machine','Elliptical','Stair climber']],
['Chest',['Dumbbell Press','Incline Dumbbell Press','Machine fly','Bench press','Incline bench press','Cable fly','Push up']],
['Legs',['Hack squat','Leg Extensions','Leg Curls','Leg Press','Squat','Romanian deadlift','Calf raise','Abductor/Adductor','Lunge']],
['Shoulders',['Shoulder Dumbbell Press','Cable side raise','Lateral raise','Overhead press','Face pull']],
['Triceps',['Tricep pushdown','Skull crusher','Overhead tricep extension','Dips']]];
const GROUPS=LIB.map(g=>g[0]);
const SEED_T={
Pull:[['Chest supported row',3,35,10],['Pulldowns',4,55,10],['Machine row',4,50,10],['Close grip cable curl',2,20,12],['Rear delt pull',4,25,12],['Deadlift',4,100,6]],
Chest:[['Dumbbell Press',4,30,10],['Machine fly',4,45,12],['Incline Dumbbell Press',4,26,10]],
Leg:[['Hack squat',3,80,8],['Leg Extensions',4,50,12],['Leg Curls',4,45,12],['Leg Press',4,140,10],['Shoulder Dumbbell Press',4,22,10],['Cable side raise',4,7.5,12]]};
function seedWorkouts(){
  const plan=[['Leg',-20],['Chest',-18],['Pull',-17],['Leg',-13],['Chest',-11],['Pull',-10],['Leg',-6],['Chest',-4],['Pull',-3],['Chest',-1]];
  return plan.map(([name,off],k)=>{
    const d=new Date();d.setHours(18,0,0,0);d.setDate(d.getDate()+off);
    const start=d.getTime(),bump=2.5*Math.floor(k/3);
    const items=SEED_T[name].map(([n,sets,w,r])=>({id:uid(),exId:slug(n),ss:null,
      sets:Array.from({length:sets},(_,i)=>({w:w+(w>=20?bump:0),r:r-((i===sets-1&&sets>2)?1:0),done:true,drop:false}))}));
    return {id:uid(),name,start,end:start+(36+((k*2)%9))*60000,bw:'',notes:'',items,sample:true};
  });
}
function seedRoutines(){
  return Object.keys(SEED_T).map(n=>({id:uid(),name:n,sample:true,items:SEED_T[n].map(([e,s])=>({exId:slug(e),sets:s,ss:null}))}));
}
function defaults(){
  return {units:'kg',rest:90,exercises:LIB.flatMap(([g,l])=>l.map(n=>({id:slug(n),name:n,group:g}))),
    workouts:seedWorkouts(),routines:seedRoutines(),bw:[],active:null};
}
const KEY='replog.v1';
let S=null;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return null;}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
let saveT=0;const saveSoon=()=>{clearTimeout(saveT);saveT=setTimeout(save,300);};
function migrate(){
  const d=defaults();
  S=Object.assign({units:'kg',rest:90,exercises:[],workouts:[],routines:[],bw:[],active:null},S||{});
  if(!S.exercises.length)S.exercises=d.exercises;
}
const exById=id=>S.exercises.find(e=>e.id===id);
const exName=id=>{const e=exById(id);return e?e.name:id;};
const hasSamples=()=>S.workouts.some(w=>w.sample)||S.routines.some(r=>r.sample);

function lastSets(exId,excl){
  let best=null;
  for(const w of S.workouts){
    if(w.id===excl)continue;
    const it=w.items.find(i=>i.exId===exId);if(!it)continue;
    const ds=it.sets.filter(s=>s.done&&s.r!=='');if(!ds.length)continue;
    if(!best||w.start>best.start)best={start:w.start,sets:ds};
  }
  return best?best.sets:[];
}
function priorBest(exId,excl){
  let m=0;
  for(const w of S.workouts){if(w.id===excl)continue;
    for(const it of w.items)if(it.exId===exId)for(const s of it.sets)if(s.done&&Number(s.w)>m)m=Number(s.w);}
  return m;
}
function sessions(exId){
  return S.workouts.filter(w=>w.items.some(i=>i.exId===exId&&i.sets.some(s=>s.done)))
    .sort((a,b)=>b.start-a.start)
    .map(w=>({w,sets:w.items.filter(i=>i.exId===exId).flatMap(i=>i.sets.filter(s=>s.done))}));
}
function allSets(){
  const a=[];
  for(const w of S.workouts)for(const it of w.items)for(const s of it.sets)
    if(s.done&&Number(s.r)>0)a.push({ex:it.exId,w:Number(s.w)||0,r:Number(s.r),t:w.start,wid:w.id});
  return a;
}
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);
function fixSS(items){
  const c={};items.forEach(i=>{if(i.ss)c[i.ss]=(c[i.ss]||0)+1;});
  items.forEach(i=>{if(i.ss&&c[i.ss]<2)i.ss=null;});
}
function newWorkout(){return {id:uid(),name:'',start:Date.now(),end:null,bw:'',notes:'',items:[]};}
function autoName(w){
  const c={};w.items.forEach(i=>{const e=exById(i.exId);if(e)c[e.group]=(c[e.group]||0)+1;});
  const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return k||'Workout';
}
function blankSets(n){return Array.from({length:n},()=>({w:'',r:'',done:false,drop:false}));}
function setsFor(exId,count,excl){
  const last=lastSets(exId,excl);
  if(!last.length)return blankSets(count||3);
  const n=count||last.length;
  return Array.from({length:n},(_,k)=>{const l=last[k]||last[last.length-1];return {w:l.w,r:l.r,done:false,drop:!!l.drop};});
}

/* ---------- charts ---------- */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e;}
function barChart(data,unit){
  const W=340,H=176,l=40,r=8,t=12,b=26,iw=W-l-r,ih=H-t-b;
  const max=niceMax(Math.max(0,...data.map(d=>d.v)));
  const n=data.length,step=iw/n,bw=Math.max(3,step*.62),every=Math.ceil(n/6);
  const grid=[0,.5,1].map(f=>{const y=t+ih-ih*f;return '<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(l-6)+'" y="'+(y+3)+'" text-anchor="end">'+kfmt(max*f)+'</text>';}).join('');
  const bars=data.map((d,i)=>{
    const h=d.v/max*ih,x=l+step*i+(step-bw)/2,y=t+ih-h,last=i===n-1;
    let s='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,0).toFixed(1)+'" rx="2" class="bar'+(last?' last':'')+'"><title>'+esc(d.label)+': '+kfmt(d.v)+(unit?' '+esc(unit):'')+'</title></rect>';
    if((n-1-i)%every===0)s+='<text class="ax" x="'+(last?W-r:(l+step*i+step/2).toFixed(1))+'" y="'+(H-8)+'" text-anchor="'+(last?'end':'middle')+'">'+esc(d.label)+'</text>';
    return s;}).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bar chart">'+grid+bars+'</svg>';
}
function lineChart(pts){
  if(!pts.length)return '';
  const W=340,H=176,l=40,r=16,t=16,b=26,iw=W-l-r,ih=H-t-b;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  if(hi===lo){hi+=1;lo-=1;}
  const pd=(hi-lo)*.15;lo=Math.max(0,lo-pd);hi+=pd;
  const t0=pts[0].t,t1=pts[pts.length-1].t,one=pts.length===1;
  const X=p=>one?l+iw/2:l+(p.t-t0)/((t1-t0)||1)*iw;
  const Y=p=>t+ih-(p.v-lo)/(hi-lo)*ih;
  const grid=[0,.5,1].map(f=>{const y=t+ih-ih*f;return '<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(l-6)+'" y="'+(y+3)+'" text-anchor="end">'+kfmt(lo+(hi-lo)*f)+'</text>';}).join('');
  const path=pts.map((p,i)=>(i?'L':'M')+X(p).toFixed(1)+','+Y(p).toFixed(1)).join('');
  const area=one?'':'<path class="area" d="'+path+'L'+X(pts[pts.length-1]).toFixed(1)+','+(t+ih)+'L'+X(pts[0]).toFixed(1)+','+(t+ih)+'Z"/>';
  const dots=pts.map((p,i)=>{const last=i===pts.length-1;return '<circle class="dot'+(last?' last':'')+'" cx="'+X(p).toFixed(1)+'" cy="'+Y(p).toFixed(1)+'" r="'+(last?5:3)+'"><title>'+esc(fmtShort(p.t))+': '+fmtN(p.v)+'</title></circle>';}).join('');
  const lp=pts[pts.length-1];
  const lab='<text class="val" x="'+Math.min(X(lp),W-r).toFixed(1)+'" y="'+(Y(lp)-10).toFixed(1)+'" text-anchor="end">'+fmtN(lp.v)+'</text>';
  const xl=one?'<text class="ax" x="'+(l+iw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+fmtShort(t0)+'</text>':'<text class="ax" x="'+l+'" y="'+(H-8)+'">'+fmtShort(t0)+'</text><text class="ax" x="'+(W-r)+'" y="'+(H-8)+'" text-anchor="end">'+fmtShort(t1)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Line chart">'+grid+area+'<path class="ln" d="'+path+'"/>'+dots+lab+xl+'</svg>';
}

function viewStats(){
  const now=Date.now();
  if(!S.workouts.length)return '<div class="topbar"><span></span><span></span></div><h1 class="big">Statistics</h1><div class="empty">Log a workout to see your charts and records.</div>';
  const earliest=S.workouts.reduce((m,w)=>Math.min(m,w.start),now);
  const nW=statRange||Math.min(52,Math.max(4,Math.ceil((now-earliest)/(7*DAY))+1));
  const first=addWeeks(weekStart(now),-(nW-1));
  const inR=S.workouts.filter(w=>w.start>=first);
  const sets=allSets().filter(s=>s.t>=first);
  const vol=sets.reduce((a,s)=>a+s.w*s.r,0);
  const time=inR.reduce((a,w)=>a+(w.end?w.end-w.start:0),0);
  const bk=Array.from({length:nW},(_,i)=>({t:addWeeks(first,i),n:0,v:0}));
  for(const w of inR){
    const i=Math.round((weekStart(w.start)-first)/(7*DAY));if(!bk[i])continue;
    bk[i].n++;
    for(const it of w.items)for(const s of it.sets)if(s.done&&Number(s.r)>0)bk[i].v+=(Number(s.w)||0)*Number(s.r);
  }
  // exercise progress
  const ids=[...new Set(allSets().map(s=>s.ex))].sort((a,b)=>exName(a).localeCompare(exName(b)));
  if(!statEx||!ids.includes(statEx)){
    const c={};allSets().forEach(s=>{c[s.ex]=(c[s.ex]||0)+1;});
    statEx=ids.sort((a,b)=>c[b]-c[a])[0]||null;ids.sort((a,b)=>exName(a).localeCompare(exName(b)));
  }
  let prog='',best=null;
  if(statEx){
    const pts=[...S.workouts].sort((a,b)=>a.start-b.start).map(w=>{
      let m=0;w.items.forEach(i=>{if(i.exId===statEx)i.sets.forEach(s=>{if(s.done&&Number(s.w)>m)m=Number(s.w);});});
      return m>0?{t:w.start,v:m}:null;}).filter(Boolean);
    allSets().filter(s=>s.ex===statEx).forEach(s=>{if(!best||s.w>best.w||(s.w===best.w&&s.r>best.r))best=s;});
    prog='<div class="card chart">'+(pts.length?lineChart(pts):'<div class="empty">No weight logged for this exercise yet.</div>')+'</div>'+
      (best?'<p class="mut" style="margin:8px 2px 0">Heaviest set: <b style="color:var(--fg)">'+fmtN(best.w)+' '+S.units+' × '+best.r+'</b> · Estimated 1RM '+fmtN(e1rm(best.w,best.r))+' '+S.units+'</p>':'');
  }
  // PRs
  const pr=new Map();
  allSets().forEach(s=>{const c=pr.get(s.ex);if(!c||s.w>c.w||(s.w===c.w&&s.r>c.r))pr.set(s.ex,s);});
  let prl=[...pr.values()].filter(p=>p.w>0).sort((a,b)=>b.t-a.t);
  const total=prl.length;if(!showAllPR)prl=prl.slice(0,8);
  const unitLbl=S.units;
  return '<div class="topbar"><span></span><span></span></div><h1 class="big">Statistics</h1>'+
    '<div class="seg" role="group" aria-label="Range">'+[[4,'4W'],[12,'12W'],[26,'6M'],[0,'All']].map(([v,l])=>'<button aria-pressed="'+(statRange===v)+'" data-act="stat-range" data-v="'+v+'">'+l+'</button>').join('')+'</div>'+
    '<div class="tiles" style="margin-top:14px"><div class="card tile"><b>'+inR.length+'</b><span>Workouts</span></div><div class="card tile"><b>'+kfmt(vol)+'</b><span>Volume ('+unitLbl+')</span></div><div class="card tile"><b>'+sets.length+'</b><span>Sets</span></div><div class="card tile"><b>'+(inR.length?fmtDur(time/inR.length):'–')+'</b><span>Avg length</span></div></div>'+
    '<h2 class="sec">Workouts per week</h2><div class="card chart">'+barChart(bk.map(b=>({label:fmtShort(b.t),v:b.n})),'workouts')+'</div>'+
    '<h2 class="sec">Volume per week ('+unitLbl+')</h2><div class="card chart">'+barChart(bk.map(b=>({label:fmtShort(b.t),v:Math.round(b.v)})),unitLbl)+'</div>'+
    '<h2 class="sec">Exercise progress</h2>'+(statEx?'<select id="st-ex" class="sel" aria-label="Exercise">'+ids.map(i=>'<option value="'+esc(i)+'"'+(i===statEx?' selected':'')+'>'+esc(exName(i))+'</option>').join('')+'</select><div style="height:10px"></div>'+prog:'<div class="empty">Nothing logged yet.</div>')+
    '<h2 class="sec">Personal records</h2><div class="card">'+(prl.length?prl.map(p=>'<div class="prrow"><b>'+esc(exName(p.ex))+'</b><span>'+fmtN(p.w)+' '+unitLbl+' × '+p.r+'<br>'+fmtShort(p.t)+'</span></div>').join(''):'<div class="empty">No records yet.</div>')+'</div>'+
    (total>8?'<button class="lnk" style="margin-top:6px" data-act="show-pr">'+(showAllPR?'Show fewer':'Show all '+total)+'</button>':'');
}

    '<div class="sbody"><div class="card rows"><label class="row"><input id="f-name" class="grow" type="text" placeholder="Name" autocomplete="off" value="'+esc(w.name)+'"></label>'+
    '<label class="row"><span>Start Time</span><input id="f-start" type="datetime-local" value="'+toLocalInput(w.start)+'"></label>'+
    '<label class="row"><span>End Time</span>'+(active?'<span class="mut">-</span>':'<input id="f-end" type="datetime-local" value="'+(w.end?toLocalInput(w.end):'')+'">')+'</label>'+
    '<label class="row"><span>Bodyweight</span><span class="inl"><input id="f-bw" class="short" type="text" inputmode="decimal" placeholder="–" value="'+esc(w.bw)+'"><span class="mut">'+S.units+'</span></span></label>'+
    '<label class="row"><textarea id="f-notes" rows="1" placeholder="Notes">'+esc(w.notes)+'</textarea></label></div>'+
    w.items.map((it,i)=>itemHtml(it,i,w)).join('')+
    '<button class="card addrow" data-act="add-ex">Add Exercise</button></div>';
  const nb=$('#f-notes');if(nb&&nb.value){nb.style.height='auto';nb.style.height=nb.scrollHeight+'px';}
  s.querySelector('.sbody').scrollTop=top;
}
function addToWorkout(ids,ss){
  const w=ed.w,gid=(ss&&ids.length>1)?uid():null;
  ids.forEach(exId=>w.items.push({id:uid(),exId,ss:gid,sets:setsFor(exId,0,w.id)}));
  save();renderEditor();
}
function cleanup(w){
  w.items.forEach(it=>{
    it.sets=it.sets.filter(s=>s.r!==''||s.w!=='');
    it.sets.forEach(s=>{if(Number(s.r)>0)s.done=true;});
  });
  w.items=w.items.filter(it=>it.sets.length);
  fixSS(w.items);
}
function saveAsRoutine(w){
  if(!w.items.length){toast('Add an exercise first');return;}
  S.routines.push({id:uid(),name:w.name||autoName(w),items:w.items.map(i=>({exId:i.exId,sets:i.sets.length,ss:i.ss}))});
  save();toast('Saved as a routine');
}

/* ---------- rest timer ---------- */
function renderTimer(){
  const el=$('#timer');
  if(!T.on){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  el.innerHTML='<div class="tin"><button class="tp" data-act="t-play" aria-label="'+(T.run?'Pause':'Start')+'">'+ic(T.run?'pause':'play',22)+'</button><button class="tn" data-act="t-minus">−15</button><span id="t-d" class="td'+(T.left===0?' zero':'')+'">'+mmss(T.left)+'</span><button class="tn" data-act="t-plus">+15</button><button class="tx" data-act="t-x" aria-label="Close timer">'+ic('x',18)+'</button></div>';
}
function ensureAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){}}
function beep(){
  try{ensureAudio();if(audio){[0,.28,.56].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+.18);});}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
}
function startRest(){ensureAudio();T.on=true;T.dur=S.rest;T.left=S.rest;T.run=true;T.end=Date.now()+T.left*1000;renderTimer();}
setInterval(()=>{
  if(!T.on||!T.run)return;
  T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  const d=$('#t-d');if(d)d.textContent=mmss(T.left);
  if(T.left===0){T.run=false;beep();renderTimer();}
},250);

/* ---------- exercise picker ---------- */
function openPicker(cb){pk={group:null,q:'',mode:'regular',sel:[],cb};$('#picker').hidden=false;renderPicker();}
function closePicker(){$('#picker').hidden=true;$('#picker').innerHTML='';pk=null;}
function renderPicker(){
  const inGroup=pk.group&&!pk.q;
  $('#picker').innerHTML='<div class="obar"><div class="oleft">'+(inGroup?'<button class="lnk" data-act="pk-back">'+ic('left',20)+' Back</button>':'<button class="lnk" data-act="pk-cancel">Cancel</button>')+'</div><h2>'+(inGroup?esc(pk.group):'Select Exercise')+'</h2><div class="oright"><button class="ib" data-act="pk-new" aria-label="New exercise">'+ic('plus',26)+'</button></div></div>'+
    '<div class="search">'+ic('search',18)+'<input id="pk-q" type="search" placeholder="Search Exercises" autocomplete="off" value="'+esc(pk.q)+'"></div>'+
    '<div class="sbody" id="pk-list" style="padding-bottom:120px"></div>'+
    '<div class="pkfoot"><div class="seg" role="group" aria-label="Mode"><button data-act="pk-mode" data-v="regular" aria-pressed="'+(pk.mode==='regular')+'">Regular</button><button data-act="pk-mode" data-v="superset" aria-pressed="'+(pk.mode==='superset')+'">Superset</button></div><span id="pk-add"></span></div>';
  renderPickerList();
}
function renderPickerList(){
  const q=pk.q.trim().toLowerCase(),el=$('#pk-list');let h='';
  const row=e=>'<button class="li" data-act="pk-ex" data-id="'+esc(e.id)+'"><span>'+esc(e.name)+(q?'<small class="mut">'+esc(e.group)+'</small>':'')+'</span>'+(pk.mode==='superset'?'<span class="tick'+(pk.sel.includes(e.id)?' on':'')+'">'+(pk.sel.includes(e.id)?ic('check',14):'')+'</span>':'')+'</button>';
  const byName=(a,b)=>a.name.localeCompare(b.name);
  if(q){const r=S.exercises.filter(e=>e.name.toLowerCase().includes(q)).sort(byName);h=r.length?r.map(row).join(''):'<div class="empty">No match. Tap + to add it.</div>';}
  else if(pk.group){h=S.exercises.filter(e=>e.group===pk.group).sort(byName).map(row).join('');}
  else{
    const groups=[...GROUPS,...new Set(S.exercises.map(e=>e.group).filter(g=>g&&!GROUPS.includes(g)))];
    h=groups.map(g=>'<button class="li" data-act="pk-group" data-id="'+esc(g)+'"><span>'+esc(g)+'</span><span class="mut">'+ic('right',18)+'</span></button>').join('');
  }
  el.innerHTML=h;
  const add=$('#pk-add');
  add.innerHTML=(pk.mode==='superset'&&pk.sel.length)?'<button class="btn pri sm" data-act="pk-add-ss">Add '+pk.sel.length+(pk.sel.length>1?' as superset':'')+'</button>':'';
}
function finishPick(ids,ss){const cb=pk.cb;closePicker();cb(ids,ss);}

/* ---------- routine editor ---------- */
function openRoutineEditor(r){
  re={r:r?JSON.parse(JSON.stringify(r)):{id:uid(),name:'',items:[]},isNew:!r};ed=null;
  $('#sheet').hidden=false;lockScroll(true);renderRoutineEditor();
}
function renderRoutineEditor(){
  const r=re.r;
  $('#sheet').innerHTML='<div class="obar"><div class="oleft"><button class="lnk" data-act="re-cancel">Cancel</button></div><h2>Routine</h2><div class="oright"><button class="lnk strong" data-act="re-save">Save</button></div></div><div class="sbody"><div class="card rows"><label class="row"><input id="r-name" class="grow" type="text" placeholder="Routine name" autocomplete="off" value="'+esc(r.name)+'"></label></div>'+
    r.items.map((it,i)=>'<div class="card ritem'+(it.ss?' ss':'')+'"><div class="rname"><b>'+esc(exName(it.exId))+'</b>'+(it.ss?'<small>Superset</small>':'')+'</div><div class="stepper"><button data-act="re-sets" data-i="'+i+'" data-d="-1" aria-label="Fewer sets">−</button><span>'+it.sets+' sets</span><button data-act="re-sets" data-i="'+i+'" data-d="1" aria-label="More sets">+</button><button class="ib dng" data-act="re-rm" data-i="'+i+'" aria-label="Remove">'+ic('trash',20)+'</button></div></div>').join('')+
    '<button class="card addrow" data-act="re-add">Add Exercise</button>'+(re.isNew?'':'<div style="height:16px"></div><button class="btn dng" data-act="re-del">Delete routine</button>')+'</div>';
}

/* ---------- export ---------- */
const csvCell=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
function csvAll(){
  const rows=[['Date','Workout','Start','End','Duration (min)','Bodyweight','Exercise','Muscle group','Set','Weight','Reps','Dropset','Superset','Notes']];
  [...S.workouts].sort((a,b)=>a.start-b.start).forEach(w=>w.items.forEach(it=>{
    const ex=exById(it.exId)||{name:it.exId,group:''};
    it.sets.filter(s=>s.done).forEach((s,k)=>rows.push([toLocalInput(w.start).slice(0,10),w.name,toLocalInput(w.start).replace('T',' '),w.end?toLocalInput(w.end).replace('T',' '):'',w.end?Math.round((w.end-w.start)/60000):'',w.bw,ex.name,ex.group,k+1,s.w,s.r,s.drop?'yes':'',it.ss?'yes':'',w.notes]));
  }));
  return rows.map(r=>r.map(csvCell).join(',')).join('\n');
}

/* ---------- actions ---------- */
const ACT={
tab:b=>{tab=b.dataset.v;logEdit=false;renderTabs();renderView();scrollTo(0,0);},
new:()=>{
  if(S.active){openEditor(S.active,'active');return;}
  S.active=newWorkout();save();openEditor(S.active,'active');
},
resume:()=>openEditor(S.active,'active'),
'log-edit':()=>{logEdit=!logEdit;renderView();},
'open-w':b=>{if(logEdit)return;const w=S.workouts.find(x=>x.id===b.dataset.id);if(w)openEditor(w,'edit');},
'del-w':b=>{const id=b.dataset.id;confirmBox('Delete this workout?','Delete',()=>{S.workouts=S.workouts.filter(w=>w.id!==id);save();renderView();});},
'clear-samples':()=>confirmBox('Remove the sample workouts and routines?','Remove',()=>{S.workouts=S.workouts.filter(w=>!w.sample);S.routines=S.routines.filter(r=>!r.sample);save();renderView();toast('Sample data removed');}),
'start-routine':b=>{
  const r=S.routines.find(x=>x.id===b.dataset.id);if(!r)return;
  if(S.active){openEditor(S.active,'active');toast('Finish your current workout first');return;}
  const w=newWorkout();w.name=r.name;
  w.items=r.items.map(i=>({id:uid(),exId:i.exId,ss:i.ss,sets:setsFor(i.exId,i.sets,w.id)}));
  S.active=w;save();openEditor(w,'active');
},
'new-routine':()=>openRoutineEditor(null),
'edit-routine':b=>openRoutineEditor(S.routines.find(x=>x.id===b.dataset.id)),
/* editor */
'ed-min':()=>{save();closeSheet();},
'ed-finish':()=>{
  const w=ed.w;cleanup(w);
  if(ed.mode==='active'){
    if(!w.items.length){S.active=null;save();closeSheet();toast('Empty workout discarded');return;}
    w.end=Date.now();if(!w.name.trim())w.name=autoName(w);
    const bw=Number(String(w.bw).replace(',','.'));if(bw>0)S.bw.push({t:w.start,v:bw});
    S.workouts.push(w);S.active=null;
    T.on=false;T.run=false;renderTimer();
  }
  save();closeSheet();
},
'ed-menu':()=>{
  const w=ed.w,active=ed.mode==='active';
  actionSheet('',[
    {label:'Save as routine',fn:()=>saveAsRoutine(w)},
    {label:active?'Discard workout':'Delete workout',danger:true,fn:()=>confirmBox(active?'Discard this workout?':'Delete this workout?',active?'Discard':'Delete',()=>{
      if(active)S.active=null;else S.workouts=S.workouts.filter(x=>x.id!==w.id);
      save();closeSheet();})}]);
},
'timer-toggle':()=>{if(T.on){T.on=false;T.run=false;renderTimer();}else{T.on=true;T.dur=S.rest;T.left=S.rest;T.run=false;renderTimer();}},
'add-ex':()=>openPicker((ids,ss)=>addToWorkout(ids,ss)),
'set-add':b=>{
  const it=ed.w.items[+b.dataset.i],l=it.sets[it.sets.length-1];
  it.sets.push({w:l?l.w:'',r:l?l.r:'',done:false,drop:false});save();renderEditor();
},
'set-done':b=>{
  const r=b.closest('.set'),s=ed.w.items[+r.dataset.i].sets[+r.dataset.s];
  s.done=!s.done;save();if(s.done)startRest();renderEditor();
},
'set-drop':b=>{
  const r=b.closest('.set'),s=ed.w.items[+r.dataset.i].sets[+r.dataset.s];
  s.drop=!s.drop;save();renderEditor();
},
'ex-hist':b=>{
  const it=ed.w.items[+b.dataset.i],ss=sessions(it.exId).filter(x=>x.w.id!==ed.w.id).slice(0,6);
  openModal('<h3>'+esc(exName(it.exId))+'</h3>'+(ss.length?ss.map(x=>'<div class="hist"><span>'+fmtShort(x.w.start)+'</span><span>'+x.sets.map(s=>fmtN(s.w)+'×'+s.r).join(', ')+'</span></div>').join(''):'<p class="mut">No earlier sessions yet.</p>')+'<button class="btn" data-act="modal-close">Close</button>');
},
'ex-menu':b=>{
  const i=+b.dataset.i,w=ed.w,it=w.items[i];
  actionSheet(exName(it.exId),[
    {label:'Exercise history',fn:()=>ACT['ex-hist']({dataset:{i}})},
    {label:'Repeat last set ×N',fn:()=>{
      openModal('<h3>Repeat last set</h3><input class="fld" id="rp-n" type="text" inputmode="numeric" value="2" aria-label="Times"><button class="btn pri" data-act="rp-go" data-i="'+i+'">Repeat</button><button class="btn" data-act="modal-close">Cancel</button>');}},
    {label:'Remove last set',fn:()=>{if(it.sets.length>1){it.sets.pop();save();renderEditor();}else toast('An exercise needs at least one set');}},
    {label:'Move up',fn:()=>{if(i>0){[w.items[i-1],w.items[i]]=[w.items[i],w.items[i-1]];save();renderEditor();}}},
    {label:'Move down',fn:()=>{if(i<w.items.length-1){[w.items[i+1],w.items[i]]=[w.items[i],w.items[i+1]];save();renderEditor();}}},
    {label:'Remove exercise',danger:true,fn:()=>{w.items.splice(i,1);fixSS(w.items);save();renderEditor();}}]);
},
'rp-go':b=>{
  const n=Math.max(1,Math.min(20,parseInt($('#rp-n').value,10)||1)),it=ed.w.items[+b.dataset.i],l=it.sets[it.sets.length-1];
  closeModal();for(let k=0;k<n;k++)it.sets.push({w:l?l.w:'',r:l?l.r:'',done:false,drop:false});save();renderEditor();
},
/* modal */
'modal-close':(b,e)=>{if(e.target===b||b.tagName==='BUTTON')closeModal();},
'menu-pick':b=>{const f=menuFns[+b.dataset.i];closeModal();if(f)f();},
'confirm-yes':()=>{const f=pendingConfirm;pendingConfirm=null;closeModal();if(f)f();},
'out-copy':()=>{
  const t=showText.cur.text;
  const fallback=()=>{const a=$('#out-text');a.select();try{document.execCommand('copy');toast('Copied');}catch(e){toast('Select the text and copy it');}};
  try{navigator.clipboard.writeText(t).then(()=>toast('Copied')).catch(fallback);}catch(e){fallback();}
},
'out-dl':()=>{
  const c=showText.cur;
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c.text],{type:c.mime}));a.download=c.file;document.body.appendChild(a);a.click();a.remove();toast('Download started');}catch(e){toast('Use Copy instead');}
},
/* timer */
't-play':()=>{
  ensureAudio();
  if(T.run){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));T.run=false;}
  else{if(T.left===0)T.left=T.dur;T.end=Date.now()+T.left*1000;T.run=true;}
  renderTimer();
},
't-minus':()=>{if(T.run)T.end-=15000;else T.left=Math.max(0,T.left-15);if(T.run)T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));renderTimer();},
't-plus':()=>{if(T.run){T.end+=15000;T.left=Math.ceil((T.end-Date.now())/1000);}else T.left+=15;renderTimer();},
't-x':()=>{T.on=false;T.run=false;renderTimer();},
/* picker */
'pk-cancel':()=>closePicker(),
'pk-back':()=>{pk.group=null;renderPicker();},
'pk-group':b=>{pk.group=b.dataset.id;renderPicker();},
'pk-mode':b=>{pk.mode=b.dataset.v;if(pk.mode==='regular')pk.sel=[];renderPicker();},
'pk-ex':b=>{
  const id=b.dataset.id;
  if(pk.mode==='regular'){finishPick([id],false);return;}
  const i=pk.sel.indexOf(id);if(i>=0)pk.sel.splice(i,1);else pk.sel.push(id);renderPickerList();
},
'pk-add-ss':()=>finishPick(pk.sel.slice(),true),
'pk-new':()=>{
  openModal('<h3>New exercise</h3><input class="fld" id="nx-name" type="text" placeholder="Name" autocomplete="off"><select class="fld" id="nx-grp">'+GROUPS.map(g=>'<option'+(pk.group===g?' selected':'')+'>'+g+'</option>').join('')+'</select><button class="btn pri" data-act="nx-create">Create</button><button class="btn" data-act="modal-close">Cancel</button>');
},
'nx-create':()=>{
  const name=$('#nx-name').value.trim(),group=$('#nx-grp').value;
  if(!name){toast('Enter a name');return;}
  let ex=S.exercises.find(e=>e.name.toLowerCase()===name.toLowerCase());
  if(!ex){let id=slug(name)||uid();if(exById(id))id+='-'+uid();ex={id,name,group,custom:true};S.exercises.push(ex);save();}
  closeModal();
  if(pk.mode==='regular')finishPick([ex.id],false);
  else{if(!pk.sel.includes(ex.id))pk.sel.push(ex.id);renderPickerList();}
},
/* routine editor */
're-cancel':()=>closeSheet(),
're-save':()=>{
  const r=re.r;r.name=r.name.trim()||'Routine';
  const i=S.routines.findIndex(x=>x.id===r.id);
  if(i>=0)S.routines[i]=r;else S.routines.push(r);
  save();closeSheet();
},
're-sets':b=>{const it=re.r.items[+b.dataset.i];it.sets=Math.max(1,Math.min(20,it.sets+Number(b.dataset.d)));renderRoutineEditor();},
're-rm':b=>{re.r.items.splice(+b.dataset.i,1);fixSS(re.r.items);renderRoutineEditor();},
're-add':()=>openPicker((ids,ss)=>{
  const gid=(ss&&ids.length>1)?uid():null;
  ids.forEach(exId=>re.r.items.push({exId,sets:3,ss:gid}));renderRoutineEditor();}),
're-del':()=>confirmBox('Delete this routine?','Delete',()=>{S.routines=S.routines.filter(x=>x.id!==re.r.id);save();closeSheet();}),
/* stats and profile */
'stat-range':b=>{statRange=Number(b.dataset.v);renderView();},
'show-pr':()=>{showAllPR=!showAllPR;renderView();},
'bw-add':()=>{
  const v=Number($('#bw-in').value.trim().replace(',','.'));
  if(!(v>0)){toast('Enter your weight');return;}
  S.bw.push({t:Date.now(),v});save();renderView();
},
'bw-rm':b=>{S.bw=S.bw.filter(x=>String(x.t)!==b.dataset.t);save();renderView();},
units:b=>{S.units=b.dataset.v;save();renderView();},
'export-csv':()=>showText('Export CSV',csvAll(),'rep-log-'+toLocalInput(Date.now()).slice(0,10)+'.csv','text/csv'),
'export-json':()=>showText('Backup',JSON.stringify(S),'rep-log-backup-'+toLocalInput(Date.now()).slice(0,10)+'.json','application/json'),
restore:()=>openModal('<h3>Restore from backup</h3><p class="mut" style="margin:0">Paste the backup text. This replaces everything on this device.</p><textarea class="out" id="rs-text" placeholder="Paste backup here"></textarea><button class="btn pri" data-act="restore-go">Restore</button><button class="btn" data-act="modal-close">Cancel</button>'),
'restore-go':()=>{
  try{
    const d=JSON.parse($('#rs-text').value);
    if(!d||!Array.isArray(d.workouts))throw new Error('bad');
    S=d;migrate();save();closeModal();tab='log';renderTabs();renderView();toast('Backup restored');
  }catch(e){toast('That does not look like a backup');}
},
wipe:()=>confirmBox('Delete all workouts, routines and settings?','Delete everything',()=>{
  S=null;migrate();S.workouts=[];S.routines=[];save();T.on=false;renderTimer();renderView();toast('All data deleted');})
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=ACT[b.dataset.act];if(f)f(b,e);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.wk[data-act]')){e.preventDefault();e.target.click();}
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(pk&&t.id==='pk-q'){pk.q=t.value;renderPickerList();return;}
  if(ed){
    if(t.id==='f-name')ed.w.name=t.value;
    else if(t.id==='f-bw')ed.w.bw=t.value;
    else if(t.id==='f-notes'){ed.w.notes=t.value;t.style.height='auto';t.style.height=t.scrollHeight+'px';}
    else if(t.dataset&&t.dataset.f){
      const r=t.closest('.set');if(!r)return;
      const s=ed.w.items[+r.dataset.i].sets[+r.dataset.s],v=t.value.trim().replace(',','.');
      if(v==='')s[t.dataset.f]='';else if(!isNaN(Number(v)))s[t.dataset.f]=Number(v);
    }else return;
    saveSoon();
  }else if(re&&t.id==='r-name')re.r.name=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(ed&&t.id==='f-start'){const v=new Date(t.value).getTime();if(!isNaN(v)){ed.w.start=v;$('#ed-title').textContent=fmtShort(v);saveSoon();}}
  else if(ed&&t.id==='f-end'){const v=new Date(t.value).getTime();ed.w.end=isNaN(v)?null:v;saveSoon();}
  else if(t.id==='st-ex'){statEx=t.value;renderView();}
  else if(t.id==='rest-sel'){S.rest=Number(t.value);save();}
});
window.addEventListener('pagehide',save);
document.addEventListener('visibilitychange',()=>{if(document.hidden)save();});

/* ---------- start ---------- */
S=load();
if(!S)S=defaults();
migrate();save();
renderTabs();renderView();renderTimer();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
</body></html>
