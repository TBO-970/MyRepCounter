<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Rep Log"><meta name="theme-color" content="#07090a"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon-192.png"><style>:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style><title>Rep Log</title>

<style>
/* ============================================================
   Rep Log — design system
   Tokens first, then layout, then components. Single dark theme.
   ============================================================ */
:root{
  --bg:#07090a; --surface:#15191b; --surface-2:#1f2427; --surface-3:#2b3236;
  --line:#2a3135; --line-soft:#222a2e;
  --fg:#f1f5f6; --muted:#8a949a; --muted-2:#5f696f;
  --accent:#2cc8d8; --accent-ink:#04171a; --accent-soft:rgba(44,200,216,.14);
  --good:#4cc38a; --warn:#f0b04a; --danger:#ef6461;
  --dl:#b9a6fb; --dl-ink:#150f27; --dl-soft:rgba(154,128,246,.16);

  --font-ui:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
  --font-num:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --fs-xs:11px; --fs-sm:12px; --fs-md:14px; --fs-base:15px; --fs-lg:17px;
  --fs-xl:20px; --fs-2xl:26px; --fs-3xl:34px;

  --sp-1:4px; --sp-2:8px; --sp-3:12px; --sp-4:16px; --sp-5:20px; --sp-6:28px;

  --r-sm:8px; --r-md:12px; --r-lg:16px; --r-xl:22px; --r-pill:999px;

  --sh-1:0 1px 0 rgba(255,255,255,.03) inset, 0 1px 2px rgba(0,0,0,.35);
  --sh-2:0 1px 0 rgba(255,255,255,.04) inset, 0 6px 20px rgba(0,0,0,.4);

  --tap:44px;
  --gutter:16px;
  --maxw:560px;
  --pl:max(var(--gutter),env(safe-area-inset-left,0px),calc((100% - var(--maxw))/2));
  --pr:max(var(--gutter),env(safe-area-inset-right,0px),calc((100% - var(--maxw))/2));

  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
body{
  margin:0;background:var(--bg);color:var(--fg);
  font:var(--fs-base)/1.45 var(--font-ui);
  padding-left:var(--pl);padding-right:var(--pr);
  -webkit-tap-highlight-color:transparent;
  overscroll-behavior-y:none;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit;min-height:var(--tap)}
input,textarea,select{font:inherit;color:inherit;background:transparent;border:0;outline:0;min-width:0;border-radius:0}
textarea{resize:none;width:100%;padding:var(--sp-3) 0;line-height:1.45}
svg{display:block;flex:none}
img{max-width:100%;display:block}
[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
small,.mut{color:var(--muted);font-size:var(--fs-sm)}
.dng{color:var(--danger)}
.tnum{font-variant-numeric:tabular-nums}

main{padding-bottom:calc(96px + env(safe-area-inset-bottom,0px))}
#view:focus{outline:none}
.topbar{display:flex;justify-content:space-between;align-items:center;min-height:56px;gap:var(--sp-2)}
h1.big{font-size:var(--fs-3xl);font-weight:800;letter-spacing:-.02em;margin:var(--sp-1) 0 var(--sp-4);line-height:1.05}
h2.sec{font-size:var(--fs-xs);color:var(--muted);text-transform:uppercase;letter-spacing:.1em;
  margin:var(--sp-6) var(--sp-1) var(--sp-3);font-weight:700}
h3{font-size:var(--fs-lg);font-weight:700;letter-spacing:-.01em}

.card{
  background:var(--surface);border-radius:var(--r-md);
  box-shadow:var(--sh-1);border:1px solid var(--line-soft);
}
.stack{display:flex;flex-direction:column;gap:var(--sp-3)}
.lnk{color:var(--accent);font-weight:600;font-size:var(--fs-lg);min-height:var(--tap);padding:0 var(--sp-2);display:inline-flex;align-items:center}
.lnk.strong{font-weight:700}
.ib{width:var(--tap);height:var(--tap);display:grid;place-items:center;color:var(--accent);flex:none;border-radius:var(--r-sm)}
.ib:active{background:var(--surface-2)}

.btn{
  min-height:var(--tap);height:var(--tap);border-radius:var(--r-md);
  background:var(--surface-2);font-weight:600;padding:0 var(--sp-4);
  width:100%;display:flex;align-items:center;justify-content:center;gap:var(--sp-2);
  border:1px solid transparent;
}
.btn:active{transform:scale(.985)}
.btn:disabled{opacity:.4;pointer-events:none}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.dng{color:var(--danger);background:var(--surface-2)}
.btn.sm{height:36px;min-height:36px;font-size:var(--fs-md);width:auto;padding:0 var(--sp-3)}

.banner{
  display:flex;gap:var(--sp-3);align-items:center;justify-content:space-between;
  padding:var(--sp-3) var(--sp-4);border-radius:var(--r-md);
  background:var(--surface);border:1px solid var(--line-soft);
  margin-bottom:var(--sp-3);width:100%;font-size:var(--fs-md);box-shadow:var(--sh-1)
}
.banner.resume{border-color:var(--accent)}
.banner.dl{border-color:rgba(154,128,246,.5)}
.banner .lnk{color:var(--accent)}
.banner.dl .lnk{color:var(--dl)}
.empty{padding:var(--sp-6) var(--sp-2);text-align:center;color:var(--muted);line-height:1.6}

/* ---------- log ---------- */
.mh{display:flex;justify-content:space-between;color:var(--muted);font-weight:700;
  font-size:var(--fs-xs);letter-spacing:.08em;text-transform:uppercase;
  margin:var(--sp-5) var(--sp-1) var(--sp-2)}
.wk{
  display:flex;gap:var(--sp-4);padding:var(--sp-4);margin-bottom:var(--sp-3);
  position:relative;cursor:pointer;transition:border-color .15s, transform .15s
}
.wk:active{transform:scale(.995);border-color:var(--line)}
.date{width:46px;flex:none;border-radius:var(--r-sm);overflow:hidden;text-align:center;align-self:flex-start;background:var(--surface-2)}
.date span{display:block;font-size:var(--fs-sm);font-weight:700;color:var(--muted);background:var(--surface-3);padding:3px 0;letter-spacing:.05em}
.date b{display:block;font-size:var(--fs-2xl);line-height:1.05;padding:4px 0 6px;font-variant-numeric:tabular-nums}
.wb{flex:1;min-width:0}
.wt{display:flex;justify-content:space-between;gap:var(--sp-2);align-items:baseline}
.wt h3{margin:0;font-size:var(--fs-xl);font-weight:700}
.wt span{color:var(--muted);white-space:nowrap;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.wb ul{list-style:none;margin:var(--sp-2) 0 0;padding:0}
.wb li{padding:2px 0;overflow-wrap:anywhere;color:var(--fg);font-size:var(--fs-md)}
.del{width:30px;height:30px;border-radius:50%;background:var(--danger);color:#fff;
  display:grid;place-items:center;flex:none;align-self:center;min-height:30px}

/* ---------- overlays / sheets ---------- */
.ov{
  position:fixed;inset:0;background:var(--bg);display:flex;flex-direction:column;
  padding-top:env(safe-area-inset-top,0px);
  padding-left:var(--pl);padding-right:var(--pr);z-index:30;
  overscroll-behavior:contain;
}
#picker{z-index:40}
.obar{
  display:grid;grid-template-columns:1fr auto 1fr;align-items:center;
  min-height:56px;flex:none;gap:var(--sp-2);border-bottom:1px solid var(--line-soft)
}
.obar h2{margin:0;font-size:var(--fs-lg);font-weight:700;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none}
.oleft{display:flex;align-items:center}
.oright{display:flex;align-items:center;justify-content:flex-end}
.sbody{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:var(--sp-3) 0 calc(160px + env(safe-area-inset-bottom,0px));
  overscroll-behavior:contain}

/* ---------- settings rows ---------- */
.rows .row{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  min-height:52px;padding:0 var(--sp-4);border-bottom:1px solid var(--line-soft)}
.rows .row:last-child{border-bottom:0}
.row .grow{flex:1;text-align:left;min-height:52px}
.row .inl{display:flex;align-items:center;gap:var(--sp-2)}
.row .short{width:72px;text-align:right;font-variant-numeric:tabular-nums}
.row input[type=datetime-local]{text-align:right;color:var(--fg);max-width:62%;font-variant-numeric:tabular-nums}
.addrow{width:100%;min-height:52px;margin-top:var(--sp-4);color:var(--accent);
  font-weight:600;font-size:var(--fs-base);text-align:left;padding:0 var(--sp-4);
  display:flex;align-items:center;justify-content:space-between}

/* ---------- exercise card ---------- */
.ex{padding:var(--sp-3) var(--sp-3) var(--sp-2);margin-top:var(--sp-4)}
.ex.ss{border-left:3px solid var(--accent)}
.ex.ss-cont{margin-top:2px;border-top-left-radius:0;border-top-right-radius:0}
.ex.ss-more{border-bottom-left-radius:0;border-bottom-right-radius:0}
.sslabel{font:700 11px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;
  color:var(--accent);margin-bottom:var(--sp-1)}
.exh{display:flex;align-items:center;gap:var(--sp-2)}
.exname{flex:1;min-width:0;font-weight:700;color:var(--accent);font-size:var(--fs-lg);
  overflow-wrap:anywhere;text-align:left}
.grp{color:var(--muted);font-size:var(--fs-sm)}

.sh,.set{
  display:grid;
  grid-template-columns:34px minmax(44px,1fr) 64px 64px 40px;
  gap:var(--sp-2);align-items:center;
}
.sh{color:var(--muted);font:700 10px var(--font-ui);letter-spacing:.1em;text-align:center;
  margin:var(--sp-2) 0 var(--sp-1);text-transform:uppercase}
.set{padding:6px;margin:2px -6px;border-radius:var(--r-md);
  border:1px solid transparent;transition:background .15s,border-color .15s}
.set.done{background:var(--accent-soft);border-color:rgba(44,200,216,.22)}
.set.done .prev{opacity:.55}

.sn{width:34px;height:34px;border-radius:var(--r-sm);background:var(--surface-2);
  font-weight:700;text-align:center;font-variant-numeric:tabular-nums;min-height:34px;border:0}
.sn.drop{color:var(--warn);background:rgba(240,176,74,.14)}

.prev{color:var(--muted);font-size:var(--fs-sm);display:flex;flex-direction:column;
  align-items:center;gap:3px;font-variant-numeric:tabular-nums;min-width:0;line-height:1.2}
.pr{font:800 9px var(--font-ui);letter-spacing:.08em;color:var(--accent-ink);
  background:var(--warn);border-radius:4px;padding:1px 5px;line-height:1.4}

.num{height:40px;border-radius:var(--r-sm);background:var(--surface-2);
  text-align:center;font-weight:600;font-variant-numeric:tabular-nums;
  width:100%;min-width:0;border:1px solid transparent}
.num:focus{border-color:var(--accent);background:var(--surface)}

.chk{width:40px;height:40px;border-radius:var(--r-sm);background:var(--surface-2);
  display:grid;place-items:center;color:var(--muted);min-height:40px;border:0}
.set.done .chk{background:var(--accent);color:var(--accent-ink)}
.addset{width:100%;height:var(--tap);color:var(--accent);font-weight:600;text-align:center;min-height:var(--tap)}

@media (max-width:340px){
  .sh,.set{grid-template-columns:30px minmax(38px,1fr) 56px 56px 36px;gap:6px}
  .num,.chk{height:36px}
}

/* ---------- routine items ---------- */
.ritem{padding:var(--sp-3) var(--sp-4);margin-top:var(--sp-3);display:flex;
  align-items:center;justify-content:space-between;gap:var(--sp-3);flex-wrap:wrap}
.ritem.ss{border-left:3px solid var(--accent)}
.rname{display:flex;flex-direction:column;min-width:0}
.stepper{display:flex;align-items:center;gap:var(--sp-2)}
.stepper>button:not(.ib){width:36px;height:36px;border-radius:var(--r-sm);
  background:var(--surface-2);font-size:var(--fs-xl);text-align:center;min-height:36px;line-height:1}
.stepper span{min-width:56px;text-align:center;font-variant-numeric:tabular-nums;font-size:var(--fs-md)}

/* ---------- picker ---------- */
.search{display:flex;align-items:center;gap:var(--sp-2);background:var(--surface-2);
  border-radius:var(--r-md);padding:0 var(--sp-3);height:46px;margin:var(--sp-2) 0 var(--sp-3);color:var(--muted)}
.search input{flex:1;color:var(--fg);height:100%}
.li{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  min-height:56px;border-bottom:1px solid var(--line-soft);font-size:var(--fs-lg);width:100%;text-align:left}
.li:last-child{border-bottom:0}
.li small{display:block;font-size:var(--fs-sm);margin-top:2px}
.li .tick{width:24px;height:24px;border-radius:50%;border:2px solid var(--muted);
  display:grid;place-items:center;flex:none;color:var(--accent-ink);min-height:24px}
.li .tick.on{background:var(--accent);border-color:var(--accent)}

.pkfoot{position:absolute;left:0;right:0;bottom:0;
  padding:var(--sp-2) var(--pr) calc(var(--sp-3) + env(safe-area-inset-bottom,0px)) var(--pl);
  display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);
  background:linear-gradient(transparent,var(--bg) 28%);
  border-top:1px solid var(--line-soft)}

.seg{display:inline-flex;background:var(--surface-2);border-radius:var(--r-md);padding:3px;gap:2px}
.seg button{padding:0 var(--sp-3);min-height:36px;border-radius:var(--r-sm);
  font-weight:600;font-size:var(--fs-md);color:var(--muted);text-align:center}
.seg button[aria-pressed=true]{background:var(--surface-3);color:var(--fg)}

/* ---------- modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.62);z-index:60;
  display:flex;align-items:flex-end;justify-content:center;backdrop-filter:blur(2px)}
.panel{width:100%;max-width:var(--maxw);background:var(--surface);
  border-radius:var(--r-xl) var(--r-xl) 0 0;
  padding:var(--sp-5) var(--sp-4) calc(var(--sp-5) + env(safe-area-inset-bottom,0px));
  max-height:88%;overflow-y:auto;display:flex;flex-direction:column;gap:var(--sp-2);
  box-shadow:var(--sh-2);overscroll-behavior:contain;outline:none}
.panel h3{margin:0 0 var(--sp-1)}
.panel .opt{min-height:52px;display:flex;align-items:center;border-radius:var(--r-md);
  background:var(--surface-2);padding:0 var(--sp-4);font-weight:600;width:100%}
.panel .opt:active{background:var(--surface-3)}
.panel textarea.out{background:var(--surface-2);border-radius:var(--r-sm);
  padding:var(--sp-3);height:180px;font:12px/1.45 var(--font-num);width:100%}
.panel input.fld,.panel select.fld{
  background:var(--surface-2);border-radius:var(--r-sm);height:46px;
  padding:0 var(--sp-3);width:100%;border:1px solid transparent
}
.panel input.fld:focus,.panel select.fld:focus{border-color:var(--accent)}
.hist{display:flex;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-2) 0;
  border-bottom:1px solid var(--line-soft);font-size:var(--fs-md);font-variant-numeric:tabular-nums}
.hist:last-child{border-bottom:0}
.hist span:last-child{text-align:right;color:var(--muted)}

/* ---------- timer ---------- */
#timer{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);
  border-top:1px solid var(--line);box-shadow:0 -6px 20px rgba(0,0,0,.35);
  padding:var(--sp-2) var(--pr) calc(var(--sp-2) + env(safe-area-inset-bottom,0px)) var(--pl)}
.tin{display:flex;align-items:center;justify-content:space-between;gap:var(--sp-2)}
.td{font:700 clamp(30px,9vw,40px)/1 var(--font-num);letter-spacing:.02em;
  font-variant-numeric:tabular-nums}
.td.zero{color:var(--warn)}
.tp{width:var(--tap);height:var(--tap);border-radius:50%;background:var(--accent);
  color:var(--accent-ink);display:grid;place-items:center;flex:none;min-height:var(--tap)}
.tn{height:36px;min-height:36px;padding:0 var(--sp-2);border-radius:var(--r-sm);
  background:var(--surface-2);color:var(--muted);font-weight:700;text-align:center;flex:none;
  font-variant-numeric:tabular-nums}
.tx{width:36px;height:36px;min-height:36px;border-radius:50%;background:#e9eef0;
  color:#111;display:grid;place-items:center;flex:none}

/* ---------- tabs ---------- */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;
  background:rgba(21,25,27,.94);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);
  padding:var(--sp-1) var(--pr) calc(var(--sp-1) + env(safe-area-inset-bottom,0px)) var(--pl);
  z-index:20}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--muted);
  font-size:var(--fs-xs);font-weight:600;padding:var(--sp-2) 0;text-align:center;
  border-radius:var(--r-sm);position:relative;min-height:var(--tap)}
.tab[aria-selected=true]{color:var(--accent)}
.tab[aria-selected=true]::before{content:"";position:absolute;top:0;left:50%;
  transform:translateX(-50%);width:22px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}

#toast{position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(96px + env(safe-area-inset-bottom,0px));
  background:#e9eef0;color:#111;padding:var(--sp-3) var(--sp-4);border-radius:var(--r-pill);
  font-weight:600;z-index:70;font-size:var(--fs-md);max-width:90vw;text-align:center;
  box-shadow:var(--sh-2)}

/* ---------- coach ---------- */
.cobar{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;
  margin-top:var(--sp-2);padding:var(--sp-2) var(--sp-3);border-radius:var(--r-sm);
  background:var(--surface-2);font-size:var(--fs-sm)}
.cobar .ct{font:700 10px var(--font-ui);letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.cobar .cv{font-weight:700;color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
.cobar .why{color:var(--muted);flex:1;min-width:130px}
.cobar .btn.sm{height:30px;min-height:30px;font-size:var(--fs-sm);padding:0 var(--sp-2);flex:none}
.cobar.dl{background:var(--dl-soft)}
.cobar.dl .ct{color:var(--dl)}
.cobar.dl .btn.pri{background:var(--dl);color:var(--dl-ink)}

.tg{font:700 10px var(--font-ui);color:var(--accent);background:var(--accent-soft);
  border-radius:6px;padding:2px 5px;font-variant-numeric:tabular-nums;white-space:nowrap;min-height:0;border:0}
.bdg{display:inline-block;font:700 10px var(--font-ui);letter-spacing:.06em;text-transform:uppercase;
  padding:2px 7px;border-radius:var(--r-pill);line-height:1.5}
.bdg.up{background:rgba(76,195,138,.16);color:var(--good)}
.bdg.flat{background:rgba(240,176,74,.16);color:var(--warn)}
.bdg.down{background:rgba(239,100,97,.16);color:var(--danger)}
.bdg.dl{background:var(--dl-soft);color:var(--dl)}

.crow{display:flex;align-items:center;gap:var(--sp-3);padding:var(--sp-3) var(--sp-4);
  border-bottom:1px solid var(--line-soft);width:100%;text-align:left;min-height:var(--tap)}
.crow:last-child{border-bottom:0}
.cgrow{flex:1;min-width:0}
.cgrow b{display:block;font-size:var(--fs-base);overflow-wrap:anywhere}
.cgrow small{display:block;font-size:var(--fs-sm);color:var(--muted);margin-top:2px}
.carr{text-align:right;flex:none;font-variant-numeric:tabular-nums;font-size:var(--fs-sm);line-height:1.6}
.carr b{font-weight:700;color:var(--accent);white-space:nowrap}

.gbar{height:7px;border-radius:var(--r-pill);background:var(--surface-2);overflow:hidden;margin-top:var(--sp-2)}
.gbar i{display:block;height:100%;background:var(--accent);border-radius:inherit}
.gbar i.low{background:var(--warn)}
.clbl{display:block;font:700 11px var(--font-ui);letter-spacing:.08em;text-transform:uppercase;
  color:var(--muted);margin:var(--sp-3) 0 var(--sp-1)}

.dlrow{display:flex;align-items:baseline;justify-content:space-between;gap:var(--sp-3);
  padding:var(--sp-2) 0;border-bottom:1px solid var(--line-soft);font-size:var(--fs-md)}
.dlrow:last-child{border-bottom:0}
.dlrow b{font-weight:600;overflow-wrap:anywhere}
.dlrow span{color:var(--muted);text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}

.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:var(--sp-2)}

<script>
(()=>{'use strict';
/* ---------- helpers ---------- */

const ICONS={
log:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',

right:'<path d="M9 6l6 6-6 6"/>',

/* ---------- data ---------- */
const LIB=[

['Back',['Deadlift','Pulldowns','Machine row','Chest supported row','Barbell row','Seated cable row','Pull up','Rear delt pull']],
['Biceps',['Barbell curl','Dumbbell curl','Close grip cable curl','Hammer curl','Preacher curl']],
['Cardio',['Treadmill','Cycling','Rowing machine','Elliptical','Stair climber']],
['Chest',['Dumbbell Press','Incline Dumbbell Press','Machine fly','Bench press','Incline bench press','Cable fly','Push up']],
['Legs',['Hack squat','Leg Extensions','Leg Curls','Leg Press','Squat','Romanian deadlift','Calf raise','Abductor/Adductor','Lunge']],
['Shoulders',['Shoulder Dumbbell Press','Cable side raise','Lateral raise','Overhead press','Face pull']],

const SEED_T={
Pull:[['Chest supported row',3,35,10],['Pulldowns',4,55,10],['Machine row',4,50,10],['Close grip cable curl',2,20,12],['Rear delt pull',4,25,12],['Deadlift',4,100,6]],
Chest:[['Dumbbell Press',4,30,10],['Machine fly',4,45,12],['Incline Dumbbell Press',4,26,10]],
Leg:[['Hack squat',3,80,8],['Leg Extensions',4,50,12],['Leg Curls',4,45,12],['Leg Press',4,140,10],['Shoulder Dumbbell Press',4,22,10],['Cable side raise',4,7.5,12]]};
function seedWorkouts(){
  const plan=[['Leg',-20],['Chest',-18],['Pull',-17],['Leg',-13],['Chest',-11],['Pull',-10],['Leg',-6],['Chest',-4],['Pull',-3],['Chest',-1]];
  return plan.map(([name,off],k)=>{
    const d=new Date();d.setHours(18,0,0,0);d.setDate(d.getDate()+off);
    const start=d.getTime(),bump=2.5*Math.floor(k/3);
    const items=SEED_T[name].map(([n,sets,w,r])=>({id:uid(),exId:slug(n),ss:null,
      sets:Array.from({length:sets},(_,i)=>({w:w+(w>=20?bump:0),r:r-((i===sets-1&&sets>2)?1:0),done:true,drop:false}))}));
    return {id:uid(),name,start,end:start+(36+((k*2)%9))*60000,bw:'',notes:'',items,sample:true};
  });
}
function seedRoutines(){
  return Object.keys(SEED_T).map(n=>({id:uid(),name:n,sample:true,items:SEED_T[n].map(([e,s])=>({exId:slug(e),sets:s,ss:null}))}));
}
function defaults(){
  return {units:'kg',rest:90,exercises:LIB.flatMap(([g,l])=>l.map(n=>({id:slug(n),name:n,group:g}))),
    workouts:seedWorkouts(),routines:seedRoutines(),bw:[],active:null,prog:{},rng:{},deload:null,coach:{inc:null,lo:null,hi:null,setsPerWk:10,pct:10,dlDays:7}};
}
const KEY='replog.v1';
let S=null;
function load(){try{const s=localStorage.getItem(KEY);if(s)return JSON.parse(s);}catch(e){}return null;}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S));}
  catch(e){if(!save._warned){save._warned=true;try{toast('Storage full — export a backup from Profile.');}catch(_){}}}
}
let saveT=0;
const saveSoon=()=>{clearTimeout(saveT);saveT=setTimeout(save,300);};
function migrate(){
  const d=defaults();
  S=Object.assign({units:'kg',rest:90,exercises:[],workouts:[],routines:[],bw:[],active:null,prog:{},rng:{},deload:null,coach:{inc:null,lo:null,hi:null,setsPerWk:10,pct:10,dlDays:7}},S||{});
  if(!S.exercises.length)S.exercises=d.exercises;
  if(!S.prog)S.prog={};
  if(!S.rng)S.rng={};
  if(S.deload===undefined)S.deload=null;
  S.coach=Object.assign({inc:null,lo:null,hi:null,setsPerWk:10,pct:10,dlDays:7},S.coach||{});
}
const exById=id=>S.exercises.find(e=>e.id===id);
const exName=id=>{const e=exById(id);return e?e.name:id;};
const hasSamples=()=>S.workouts.some(w=>w.sample)||S.routines.some(r=>r.sample);

function lastSets(exId,excl){
  let best=null;
  for(const w of S.workouts){
    if(w.id===excl)continue;
    const it=w.items.find(i=>i.exId===exId);if(!it)continue;
    const ds=it.sets.filter(s=>s.done&&s.r!=='');if(!ds.length)continue;
    if(!best||w.start>best.start)best={start:w.start,sets:ds};

  return best?best.sets:[];
}
function priorBest(exId,excl){
  let m=0;
  for(const w of S.workouts){if(w.id===excl)continue;
    for(const it of w.items)if(it.exId===exId)for(const s of it.sets)if(s.done&&Number(s.w)>m)m=Number(s.w);}
  return m;
}
function sessions(exId){
  return S.workouts.filter(w=>w.items.some(i=>i.exId===exId&&i.sets.some(s=>s.done)))
    .sort((a,b)=>b.start-a.start)
    .map(w=>({w,sets:w.items.filter(i=>i.exId===exId).flatMap(i=>i.sets.filter(s=>s.done))}));
}
function allSets(){
  const a=[];
  for(const w of S.workouts)for(const it of w.items)for(const s of it.sets)
    if(s.done&&Number(s.r)>0)a.push({ex:it.exId,w:Number(s.w)||0,r:Number(s.r),t:w.start,wid:w.id});
  return a;
}
const e1rm=(w,r)=>r<=1?w:w*(1+r/30);
function fixSS(items){
  const c={};items.forEach(i=>{if(i.ss)c[i.ss]=(c[i.ss]||0)+1;});
  items.forEach(i=>{if(i.ss&&c[i.ss]<2)i.ss=null;});
}
function newWorkout(){return {id:uid(),name:'',start:Date.now(),end:null,bw:'',notes:'',items:[]};}
function autoName(w){
  const c={};w.items.forEach(i=>{const e=exById(i.exId);if(e)c[e.group]=(c[e.group]||0)+1;});
  const k=Object.keys(c).sort((a,b)=>c[b]-c[a])[0];return k||'Workout';
}
function blankSets(n){return Array.from({length:n},()=>({w:'',r:'',done:false,drop:false}));}
function setsFor(exId,count,excl){
  const dl=deloadTarget(exId);
  if(dl){const n=count||3;return Array.from({length:n},()=>({w:dl.w,r:dl.r,done:false,drop:false}));}
  const last=lastSets(exId,excl);
  if(!last.length)return blankSets(count||3);
  const n=count||last.length;
  return Array.from({length:n},(_,k)=>{const l=last[k]||last[last.length-1];return {w:l.w,r:l.r,done:false,drop:!!l.drop};});
}

/* ---------- progressive overloading coach ---------- */
const parseAuto=v=>{const s=String(v==null?'':v).trim().toLowerCase().replace(',','.');if(!s||s==='auto')return null;const n=Number(s);return isFinite(n)&&n>0?n:null;};
const round2=n=>Math.round(Number(n)*100)/100;
function coach(){
  if(!S.coach)S.coach={inc:null,lo:null,hi:null,setsPerWk:10,pct:10,dlDays:7};
  if(!S.coach.setsPerWk)S.coach.setsPerWk=10;
  if(S.coach.pct==null)S.coach.pct=10;
  if(!S.coach.dlDays)S.coach.dlDays=7;
  return S.coach;
}
function progOf(exId){
  const o=(S.prog&&S.prog[exId])||{};
  return {mode:o.mode||'auto',inc:o.inc!=null?o.inc:null,lo:o.lo!=null?o.lo:null,hi:o.hi!=null?o.hi:null};
}
function isCardio(exId){const e=exById(exId);return !!(e&&e.group==='Cardio');}
function autoRange(exId){
  const ss=sessions(exId);
  if(!ss.length)return null;
  const rs=ss[0].sets.filter(s=>!s.drop&&Number(s.r)>0).map(s=>Number(s.r));
  if(!rs.length)return null;
  let mx=0;rs.forEach(r=>{if(r>mx)mx=r;});
  mx=Math.max(1,mx);
  return {lo:mx,hi:mx+2};
}
function rangeOf(exId){
  const p=progOf(exId),c=coach();
  let lo=p.lo!=null?p.lo:null,hi=p.hi!=null?p.hi:null;
  if(lo==null&&c.lo!=null)lo=c.lo;
  if(hi==null&&c.hi!=null)hi=c.hi;
  if((lo==null||hi==null)&&S.rng&&S.rng[exId]){
    if(lo==null)lo=S.rng[exId].lo;
    if(hi==null)hi=S.rng[exId].hi;
  }
  if(lo==null||hi==null){
    const inf=autoRange(exId);
    if(inf){
      if(lo==null)lo=inf.lo;
      if(hi==null)hi=inf.hi;
      const locked=(S.rng&&S.rng[exId])||null;
      if(!locked&&p.mode!=='off'&&!(c.lo!=null&&c.hi!=null)){
        if(!S.rng)S.rng={};
        S.rng[exId]={lo:lo,hi:hi};
        saveSoon();
      }
    }
  }
  if(lo==null)lo=8;
  if(hi==null)hi=Math.max(lo+2,12);
  if(hi<lo)hi=lo;
  return {lo,hi};
}
function defaultInc(exId,w){
  const c=coach();if(c.inc!=null)return c.inc;
  if(S.units==='lb')return w<25?2:w<175?5:10;
  return w<12?1:w<80?2.5:5;
}
function analyze(exId,excl,list){
  const ses=[];
  for(const x of (list||sessions(exId))){
    if(excl&&x.w.id===excl)continue;
    const sets=x.sets.filter(s=>s.done&&!s.drop&&Number(s.r)>0&&Number(s.w)>0);
    if(!sets.length)continue;
    let top=sets[0];
    sets.forEach(s=>{if(Number(s.w)>Number(top.w)||(Number(s.w)===Number(top.w)&&Number(s.r)>Number(top.r)))top=s;});
    ses.push({t:x.w.start,w:Number(top.w),r:Number(top.r),n:sets.length,
      vol:sets.reduce((a,s)=>a+Number(s.w)*Number(s.r),0),
      sets:sets.map(s=>({w:Number(s.w),r:Number(s.r)}))});
  }
  return ses;
}
function advFrom(exId,ses,rg,p){
  const cur=ses[0],prev=ses[1];
  const inc=p.inc!=null?p.inc:defaultInc(exId,cur.w);
  const mode=p.mode==='linear'?'linear':'double';
  const allHit=cur.sets.every(s=>s.r>=rg.hi);
  let flat=0;for(let i=1;i<ses.length;i++){if(ses[i].w===cur.w)flat++;else break;}
  let state='on track';
  if(prev&&cur.w>prev.w)state='progressing';
  else if(prev&&cur.w<prev.w)state='regressed';
  else if(prev&&cur.r>prev.r)state='on track';
  else if(prev)state='stalled';
  let w=cur.w,r=cur.r,kind='hold',why='';
  if(mode==='double'){
    if(allHit){kind='increase';w=round2(cur.w+inc);r=rg.lo;why='Every set hit '+rg.hi+' reps — add '+fmtN(inc)+' '+S.units+' next time';}
    else if(cur.r>=rg.hi){kind='reps';w=cur.w;r=rg.hi;why='Pull the remaining sets up to '+rg.hi+' reps, then add weight';}
    else if(prev&&Math.abs(prev.w-cur.w)<0.01&&cur.r<rg.lo&&cur.r<prev.r){kind='deload';w=deloadW(cur.w,deloadPct());r=rg.lo;why='Reps dropped at the same weight — deload to '+fmtN(w)+' '+S.units;}
    else{kind='reps';w=cur.w;r=Math.min(cur.r+1,rg.hi);why='Add a rep: '+fmtN(w)+' '+S.units+' × '+r;}
  }else{
    if(cur.r>=rg.lo){kind='increase';w=round2(cur.w+inc);r=Math.min(Math.max(cur.r,rg.lo),rg.hi);why='Add '+fmtN(inc)+' '+S.units+' and hold '+r+' reps';}
    else{kind='reps';w=cur.w;r=Math.min(cur.r+1,rg.hi);why='Missed the target reps — hold the weight and rebuild';}
  }
  if(state==='stalled'){
    const n=flat+1;
    why=(kind==='increase'?'No weight change in '+n+' sessions — add '+fmtN(inc)+' '+S.units:'No weight change in '+n+' sessions — '+why);
  }
  return {state,kind,why,w,r,cur:{w:cur.w,r:cur.r},inc,lo:rg.lo,hi:rg.hi,flat};
}
function coachAdvice(exId,excl){
  if(isCardio(exId))return {state:'na'};
  const p=progOf(exId),rg=rangeOf(exId);
  const d=S.deload,b=d&&d.base?d.base[exId]:null;
  const full=analyze(exId,excl);
  const ses=analyze(exId,excl,coachHist(exId));
  if(d&&b&&deloadActive()){
    const w=deloadW(b.w,d.pct);
    return {state:'deload',kind:'deload',w:w,r:rg.lo,cur:{w:b.w,r:b.r},lo:rg.lo,hi:rg.hi,ses:full,
      why:'Deload week — '+fmtN(w)+' '+S.units+' × '+rg.lo+' (down from '+fmtN(b.w)+')'};
  }
  if(!ses.length)return {state:'new',ses:[],lo:rg.lo,hi:rg.hi};
  if(p.mode==='off')return {state:'off',ses:full,lo:rg.lo,hi:rg.hi};
  if(d&&b&&!deloadActive()){
    const post=ses.filter(x=>x.t>=d.end);
    const pt=post.length?post[0]:null;
    const back=pt&&(pt.w>b.w||(pt.w===b.w&&pt.r>=b.r));
    if(!back){
      const pre=analyze(exId,excl,coachHist(exId).filter(x=>x.w.start<d.end));
      const pa=pre.length?advFrom(exId,pre,rg,p):null;
      const w=pa?pa.w:b.w,r=pa?pa.r:rg.lo;
      return {state:'rebuild',kind:'rebuild',w:w,r:r,cur:{w:b.w,r:b.r},lo:rg.lo,hi:rg.hi,ses:full,
        why:'Deload over — back to '+fmtN(w)+' '+S.units+' × '+r};
    }
  }
  const a=advFrom(exId,ses,rg,p);
  a.ses=full;
  return a;
}
function coachRows(){
  const ids=[];
  for(const w of S.workouts)for(const it of w.items)if(!ids.includes(it.exId))ids.push(it.exId);
  const out=[];
  for(const id of ids){
    const a=coachAdvice(id);
    if(!a||a.state==='new'||a.state==='off'||a.state==='na')continue;
    out.push({id,a});
  }
  const rank={regressed:0,stalled:1,rebuild:2,'on track':3,progressing:4,deload:5};
  out.sort((x,y)=>(rank[x.a.state]-rank[y.a.state])||(y.a.cur.w-x.a.cur.w));
  return out;
}
function groupStats(days){
  const from=Date.now()-days*DAY,g={};
  for(const w of S.workouts){
    if(w.start<from)continue;
    for(const it of w.items){
      const e=exById(it.exId),grp=e?e.group:'Other';
      if(grp==='Cardio')continue;
      g[grp]=g[grp]||{sets:0,vol:0};
      for(const s of it.sets)if(s.done&&Number(s.r)>0){g[grp].sets++;g[grp].vol+=Number(s.w)*Number(s.r);}
    }
  }
  return g;
}
function openExSettings(exId){

/* ---------- deload week ---------- */
const deloadW=(w,pct)=>round2(Math.max(1,Math.round(w*(1-(pct||0)/100)/0.5)*0.5));
function deloadPct(){const c=coach();return c.pct!=null?c.pct:10;}
function deloadDays(){const c=coach();return c.dlDays||7;}
function inDeload(t){const d=S.deload;return !!(d&&t>=d.start&&t<d.end);}
function deloadActive(){const d=S.deload;return !!(d&&Date.now()<d.end);}
function coachHist(exId){
  const ss=sessions(exId),d=S.deload;
  if(!d)return ss;
  return ss.filter(x=>!inDeload(x.w.start));
}
function topOf(sess){
  let top=null;
  for(const s of sess.sets||[]){
    if(!s.done||s.drop||Number(s.r)<=0||Number(s.w)<=0)continue;
    if(!top||Number(s.w)>Number(top.w)||(Number(s.w)===Number(top.w)&&Number(s.r)>Number(top.r)))top=s;
  }
  return top?{w:Number(top.w),r:Number(top.r)}:null;
}
function deloadBase(){
  const base={},since=Date.now()-7*DAY,ids=[];
  for(const w of S.workouts)for(const it of w.items)if(!ids.includes(it.exId))ids.push(it.exId);
  for(const id of ids){
    if(isCardio(id))continue;
    if(progOf(id).mode==='off')continue;
    const ss=sessions(id);
    if(!ss.length)continue;
    const week=ss.filter(x=>x.w.start>=since);
    const pool=week.length?week:ss;
    const top=topOf(pool[0]);
    if(!top)continue;
    base[id]={w:top.w,r:top.r};
  }
  return base;
}
function deloadTarget(exId){
  const d=S.deload;
  if(!d||!d.base||Date.now()>=d.end)return null;
  const b=d.base[exId];if(!b)return null;
  const rg=rangeOf(exId);
  return {w:deloadW(b.w,d.pct),r:rg.lo};
}
function deloadInfo(){
  const d=S.deload;if(!d)return null;
  const ids=Object.keys(d.base||{});
  let back=0,past=0;
  for(const id of ids){
    const b=d.base[id];
    const post=coachHist(id).filter(x=>x.w.start>=d.end);
    if(!post.length)continue;
    const top=topOf(post[0]);
    if(!top)continue;
    if(top.w>b.w||(top.w===b.w&&top.r>=b.r))back++;
    if(top.w>b.w||(top.w===b.w&&top.r>b.r))past++;
  }
  return {d:d,ids:ids,total:ids.length,back:back,past:past,
    left:Math.max(0,Math.ceil((d.end-Date.now())/DAY)),active:Date.now()<d.end};
}
function deloadRows(base,pct){
  const ids=Object.keys(base||{});
  if(!ids.length)return '<div class="mut" style="padding:8px 0">No history yet — log a few workouts first.</div>';
  return ids.map(id=>{
    const ex=exById(id)||{name:id},rg=rangeOf(id),b=base[id];
    const w=deloadW(b.w,pct);
    let right=fmtN(b.w)+' → '+fmtN(w)+' '+S.units+' × '+rg.lo;
    const post=S.deload?coachHist(id).filter(x=>x.w.start>=S.deload.end):[];
    if(post.length){
      const top=topOf(post[0]);
      right=fmtN(b.w)+' → '+(top?fmtN(top.w)+' '+S.units+' × '+top.r:'—');
    }
    return '<div class="dlrow"><b>'+esc(ex.name)+'</b><span>'+esc(right)+'</span></div>';
  }).join('');
}
function deloadBanner(activeOnly){
  const di=deloadInfo();
  if(!di){
    if(activeOnly)return '';
    return '<button type="button" class="banner dl" data-act="dl-open" aria-label="Start deload week"><span><b>Deload week</b><br><small>Cut your load for a week, then pick up where you left off</small></span><span class="lnk" aria-hidden="true">Start</span></button>';
  }
  if(di.active)return '<button type="button" class="banner dl" data-act="dl-open" aria-label="Deload week, '+di.left+' day'+(di.left===1?'':'s')+' left. View details."><span><b>Deload week · '+di.left+' day'+(di.left===1?'':'s')+' left</b><br><small>Working '+di.d.pct+'% lighter until '+fmtShort(di.d.end)+'</small></span><span class="lnk" aria-hidden="true">View</span></button>';
  if(activeOnly)return '';
  return '<button type="button" class="banner dl" data-act="dl-open" aria-label="Deload finished. View details."><span><b>Deload finished</b><br><small>'+di.back+' of '+di.total+' exercise'+(di.total===1?'':'s')+' back at your pre-deload level</small></span><span class="lnk" aria-hidden="true">View</span></button>';
}

/* ---------- charts ---------- */
function niceMax(v){if(v<=0)return 1;const e=Math.pow(10,Math.floor(Math.log10(v)));const f=v/e;return (f<=1?1:f<=2?2:f<=5?5:10)*e;}
function barChart(data,unit){
  const W=340,H=176,l=40,r=8,t=12,b=26,iw=W-l-r,ih=H-t-b;
  const max=niceMax(Math.max(0,...data.map(d=>d.v)));
  const n=data.length,step=iw/n,bw=Math.max(3,step*.62),every=Math.ceil(n/6);
  const grid=[0,.5,1].map(f=>{const y=t+ih-ih*f;return '<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(l-6)+'" y="'+(y+3)+'" text-anchor="end">'+kfmt(max*f)+'</text>';}).join('');
  const bars=data.map((d,i)=>{
    const h=d.v/max*ih,x=l+step*i+(step-bw)/2,y=t+ih-h,last=i===n-1;
    let s='<rect x="'+x.toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(h,0).toFixed(1)+'" rx="2" class="bar'+(last?' last':'')+'"><title>'+esc(d.label)+': '+kfmt(d.v)+(unit?' '+esc(unit):'')+'</title></rect>';
    if((n-1-i)%every===0)s+='<text class="ax" x="'+(last?W-r:(l+step*i+step/2).toFixed(1))+'" y="'+(H-8)+'" text-anchor="'+(last?'end':'middle')+'">'+esc(d.label)+'</text>';
    return s;}).join('');
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Bar chart">'+grid+bars+'</svg>';
}
function lineChart(pts){
  if(!pts.length)return '';
  const W=340,H=176,l=40,r=16,t=16,b=26,iw=W-l-r,ih=H-t-b;
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));
  if(hi===lo){hi+=1;lo-=1;}
  const pd=(hi-lo)*.15;lo=Math.max(0,lo-pd);hi+=pd;
  const t0=pts[0].t,t1=pts[pts.length-1].t,one=pts.length===1;
  const X=p=>one?l+iw/2:l+(p.t-t0)/((t1-t0)||1)*iw;
  const Y=p=>t+ih-(p.v-lo)/(hi-lo)*ih;
  const grid=[0,.5,1].map(f=>{const y=t+ih-ih*f;return '<line class="grid" x1="'+l+'" x2="'+(W-r)+'" y1="'+y+'" y2="'+y+'"/><text class="ax" x="'+(l-6)+'" y="'+(y+3)+'" text-anchor="end">'+kfmt(lo+(hi-lo)*f)+'</text>';}).join('');
  const path=pts.map((p,i)=>(i?'L':'M')+X(p).toFixed(1)+','+Y(p).toFixed(1)).join('');
  const area=one?'':'<path class="area" d="'+path+'L'+X(pts[pts.length-1]).toFixed(1)+','+(t+ih)+'L'+X(pts[0]).toFixed(1)+','+(t+ih)+'Z"/>';
  const dots=pts.map((p,i)=>{const last=i===pts.length-1;return '<circle class="dot'+(last?' last':'')+'" cx="'+X(p).toFixed(1)+'" cy="'+Y(p).toFixed(1)+'" r="'+(last?5:3)+'"><title>'+esc(fmtShort(p.t))+': '+fmtN(p.v)+'</title></circle>';}).join('');
  const lp=pts[pts.length-1];
  const lab='<text class="val" x="'+Math.min(X(lp),W-r).toFixed(1)+'" y="'+(Y(lp)-10).toFixed(1)+'" text-anchor="end">'+fmtN(lp.v)+'</text>';
  const xl=one?'<text class="ax" x="'+(l+iw/2)+'" y="'+(H-8)+'" text-anchor="middle">'+fmtShort(t0)+'</text>':'<text class="ax" x="'+l+'" y="'+(H-8)+'">'+fmtShort(t0)+'</text><text class="ax" x="'+(W-r)+'" y="'+(H-8)+'" text-anchor="end">'+fmtShort(t1)+'</text>';
  return '<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Line chart">'+grid+area+'<path class="ln" d="'+path+'"/>'+dots+lab+xl+'</svg>';
}

function viewStats(){
  const now=Date.now();
  if(!S.workouts.length)return '<div class="topbar"><span></span><span></span></div><h1 class="big">Statistics</h1><div class="empty">Log a workout to see your charts and records.</div>';
  const earliest=S.workouts.reduce((m,w)=>Math.min(m,w.start),now);
  const nW=statRange||Math.min(52,Math.max(4,Math.ceil((now-earliest)/(7*DAY))+1));
  const first=addWeeks(weekStart(now),-(nW-1));
  const inR=S.workouts.filter(w=>w.start>=first);
  const sets=allSets().filter(s=>s.t>=first);
  const vol=sets.reduce((a,s)=>a+s.w*s.r,0);
  const time=inR.reduce((a,w)=>a+(w.end?w.end-w.start:0),0);
  const bk=Array.from({length:nW},(_,i)=>({t:addWeeks(first,i),n:0,v:0}));
  for(const w of inR){
    const i=Math.round((weekStart(w.start)-first)/(7*DAY));if(!bk[i])continue;
    bk[i].n++;
    for(const it of w.items)for(const s of it.sets)if(s.done&&Number(s.r)>0)bk[i].v+=(Number(s.w)||0)*Number(s.r);
  }
  const ids=[...new Set(allSets().map(s=>s.ex))].sort((a,b)=>exName(a).localeCompare(exName(b)));
  if(!statEx||!ids.includes(statEx)){
    const c={};allSets().forEach(s=>{c[s.ex]=(c[s.ex]||0)+1;});
    statEx=ids.sort((a,b)=>c[b]-c[a])[0]||null;ids.sort((a,b)=>exName(a).localeCompare(exName(b)));
  }
  let prog='',best=null;
  if(statEx){
    const pts=[...S.workouts].sort((a,b)=>a.start-b.start).map(w=>{
      let m=0;w.items.forEach(i=>{if(i.exId===statEx)i.sets.forEach(s=>{if(s.done&&Number(s.w)>m)m=Number(s.w);});});
      return m>0?{t:w.start,v:m}:null;}).filter(Boolean);
    allSets().filter(s=>s.ex===statEx).forEach(s=>{if(!best||s.w>best.w||(s.w===best.w&&s.r>best.r))best=s;});

  }
  const pr=new Map();
  allSets().forEach(s=>{const c=pr.get(s.ex);if(!c||s.w>c.w||(s.w===c.w&&s.r>c.r))pr.set(s.ex,s);});
  let prl=[...pr.values()].filter(p=>p.w>0).sort((a,b)=>b.t-a.t);
  const total=prl.length;if(!showAllPR)prl=prl.slice(0,8);
  const unitLbl=S.units;
  return '<div class="topbar"><span></span><span></span></div><h1 class="big">Statistics</h1>'+
    '<div class="seg" role="group" aria-label="Range">'+[[4,'4W'],[12,'12W'],[26,'6M'],[0,'All']].map(([v,l])=>'<button aria-pressed="'+(statRange===v)+'" data-act="stat-range" data-v="'+v+'">'+l+'</button>').join('')+'</div>'+
    '<div class="tiles" style="margin-top:14px"><div class="card tile"><b>'+inR.length+'</b><span>Workouts</span></div><div class="card tile"><b>'+kfmt(vol)+'</b><span>Volume ('+unitLbl+')</span></div><div class="card tile"><b>'+sets.length+'</b><span>Sets</span></div><div class="card tile"><b>'+(inR.length?fmtDur(time/inR.length):'–')+'</b><span>Avg length</span></div></div>'+
    '<h2 class="sec">Workouts per week</h2><div class="card chart">'+barChart(bk.map(b=>({label:fmtShort(b.t),v:b.n})),'workouts')+'</div>'+
    '<h2 class="sec">Volume per week ('+unitLbl+')</h2><div class="card chart">'+barChart(bk.map(b=>({label:fmtShort(b.t),v:Math.round(b.v)})),unitLbl)+'</div>'+
    '<h2 class="sec">Exercise progress</h2>'+(statEx?'<select id="st-ex" class="sel" aria-label="Exercise">'+ids.map(i=>'<option value="'+esc(i)+'"'+(i===statEx?' selected':'')+'>'+esc(exName(i))+'</option>').join('')+'</select><div style="height:10px"></div>'+prog:'<div class="empty">Nothing logged yet.</div>')+
    '<h2 class="sec">Personal records</h2><div class="card">'+(prl.length?prl.map(p=>'<div class="prrow"><b>'+esc(exName(p.ex))+'</b><span>'+fmtN(p.w)+' '+unitLbl+' × '+p.r+'<br>'+fmtShort(p.t)+'</span></div>').join(''):'<div class="empty">No records yet.</div>')+'</div>'+
    (total>8?'<button class="lnk" style="margin-top:6px" data-act="show-pr">'+(showAllPR?'Show fewer':'Show all '+total)+'</button>':'');

function itemHtml(it,i,w){
  const ex=exById(it.exId)||{name:it.exId,group:''},cardio=ex.group==='Cardio';
  const prev=lastSets(it.exId,w.id),best=priorBest(it.exId,w.id),items=w.items;
  const ssPrev=!!it.ss&&i>0&&items[i-1].ss===it.ss,ssNext=!!it.ss&&i<items.length-1&&items[i+1].ss===it.ss;
  let maxW=0,maxK=-1;it.sets.forEach((s,k)=>{if(s.done&&Number(s.w)>maxW){maxW=Number(s.w);maxK=k;}});
  const adv=cardio?null:coachAdvice(it.exId,w.id);
  const openK=it.sets.findIndex(s=>!s.done);
  const coBar=!adv?'':(adv.state==='new'||adv.state==='off'
    ?'<div class="cobar"><span class="ct">Coach</span><span class="why">'+(adv.state==='off'?'Suggestions are off for this exercise.':'No history yet — log this exercise to unlock targets.')+'</span></div>'
    :'<div class="cobar'+(adv.state==='deload'?' dl':'')+'"><span class="ct">'+(adv.state==='deload'?'Deload':adv.state==='rebuild'?'Rebuild':'Coach')+'</span><span class="cv">'+fmtN(adv.w)+' '+esc(S.units)+' × '+adv.r+'</span><span class="why">'+esc(adv.why)+'</span><button class="btn sm pri" data-act="co-apply" data-i="'+i+'">Fill</button></div>');
  let n=0;
  const rows=it.sets.map((s,k)=>{
    if(!s.drop)n++;
    const p=prev[k],ptxt=p?fmtN(p.w)+'×'+p.r:'–',isPR=best>0&&k===maxK&&maxW>best;
    const tgt=(adv&&adv.w&&k===openK&&openK>=0)?'<button class="tg" data-act="co-set" data-i="'+i+'" data-s="'+k+'" aria-label="Use suggested set">'+fmtN(adv.w)+'×'+adv.r+'</button>':'';
    return '<div class="set'+(s.done?' done':'')+'" data-i="'+i+'" data-s="'+k+'">'
      +'<button class="sn'+(s.drop?' drop':'')+'" data-act="set-drop" data-i="'+i+'" data-s="'+k+'" aria-pressed="'+(s.drop?'true':'false')+'" aria-label="Set '+n+(s.drop?' is a drop set, tap to make it a normal set':' is a normal set, tap to make it a drop set')+'">'+(s.drop?'D':n)+'</button>'
      +'<span class="prev"><span>'+ptxt+'</span>'+(isPR?'<b class="pr">PR</b>':'')+tgt+'</span>'
      +'<input class="num tnum" data-f="w" type="text" inputmode="decimal" autocomplete="off" enterkeyhint="next" placeholder="0" value="'+esc(s.w)+'" aria-label="'+(cardio?'Distance in kilometres':'Weight in '+S.units)+', set '+n+'">'
      +'<input class="num tnum" data-f="r" type="text" inputmode="numeric" autocomplete="off" enterkeyhint="done" placeholder="0" value="'+esc(s.r)+'" aria-label="'+(cardio?'Duration in minutes':'Reps')+', set '+n+'">'
      +'<button class="chk" data-act="set-done" data-i="'+i+'" data-s="'+k+'" aria-pressed="'+(s.done?'true':'false')+'" aria-label="Set '+n+(s.done?' done, tap to undo':' not done, tap to complete')+'">'+ic('check',20)+'</button>'
      +'</div>';
  }).join('');
  return '<div class="card ex'+(it.ss?' ss':'')+(ssPrev?' ss-cont':'')+(ssNext?' ss-more':'')+'" data-i="'+i+'">'+(it.ss&&!ssPrev?'<div class="sslabel">Superset</div>':'')+
    '<div class="exh"><button class="exname" data-act="ex-hist" data-i="'+i+'">'+esc(ex.name)+'</button><span class="grp">'+esc(ex.group)+'</span><button class="ib" style="width:36px;height:36px" data-act="ex-menu" data-i="'+i+'" aria-label="Exercise options">'+ic('dots',20)+'</button></div>'+
    coBar+
    '<div class="sh"><span>SET</span><span>PREVIOUS</span><span>'+(cardio?'KM':S.units.toUpperCase())+'</span><span>'+(cardio?'MIN':'REPS')+'</span><span></span></div>'+rows+
    '<button class="addset" data-act="set-add" data-i="'+i+'">+ Add set</button></div>';
}

/* ---------- rest timer ---------- */
function renderTimer(){
  const el=$('#timer');
  if(!T.on){el.hidden=true;el.innerHTML='';T._announced=0;return;}
  el.hidden=false;
  el.innerHTML='<div class="tin"><button class="tp" data-act="t-play" aria-label="'+(T.run?'Pause':'Start')+'">'+ic(T.run?'pause':'play',22)+'</button><button class="tn" data-act="t-minus">−15</button><span id="t-d" class="td'+(T.left===0?' zero':'')+'">'+mmss(T.left)+'</span><button class="tn" data-act="t-plus">+15</button><button class="tx" data-act="t-x" aria-label="Close timer">'+ic('x',18)+'</button></div>'
    +'<span id="t-live" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></span>';
  announceTimer();
}
function announceTimer(){
  const live=$('#t-live');if(!live)return;
  if(T.left===0&&T._announced!==-1){live.textContent='Rest complete';T._announced=-1;return;}
  if(T.left===60&&T._announced!==60){live.textContent='One minute left';T._announced=60;return;}
  if(T.left===30&&T._announced!==30){live.textContent='Thirty seconds left';T._announced=30;}
}
function ensureAudio(){try{if(!audio)audio=new (window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();}catch(e){}}
function beep(){
  try{ensureAudio();if(audio){[0,.28,.56].forEach(d=>{const o=audio.createOscillator(),g=audio.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(audio.destination);o.start(audio.currentTime+d);o.stop(audio.currentTime+d+.18);});}}catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([200,100,200]);}catch(e){}
}
function startRest(){ensureAudio();T.on=true;T.dur=S.rest;T.left=S.rest;T.run=true;T.end=Date.now()+T.left*1000;T._announced=0;renderTimer();}
setInterval(()=>{
  if(!T.on||!T.run)return;
  T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  const d=$('#t-d');if(d)d.textContent=mmss(T.left);
  if(T.left===0){T.run=false;beep();renderTimer();}
  else announceTimer();
},250);

/* ---------- export ---------- */
const csvCell=v=>{v=String(v==null?'':v);return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;};
function csvAll(){
  const rows=[['Date','Workout','Start','End','Duration (min)','Bodyweight','Exercise','Muscle group','Set','Weight','Reps','Dropset','Superset','Notes']];
  [...S.workouts].sort((a,b)=>a.start-b.start).forEach(w=>w.items.forEach(it=>{
    const ex=exById(it.exId)||{name:it.exId,group:''};
    it.sets.filter(s=>s.done).forEach((s,k)=>rows.push([toLocalInput(w.start).slice(0,10),w.name,toLocalInput(w.start).replace('T',' '),w.end?toLocalInput(w.end).replace('T',' '):'',w.end?Math.round((w.end-w.start)/60000):'',w.bw,ex.name,ex.group,k+1,s.w,s.r,s.drop?'yes':'',it.ss?'yes':'',w.notes]));
  }));
  return rows.map(r=>r.map(csvCell).join(',')).join('\n');
}

'start-routine':b=>{
  const r=S.routines.find(x=>x.id===b.dataset.id);if(!r)return;
  if(S.active){openEditor(S.active,'active');toast('Finish your current workout first');return;}
  const w=newWorkout();w.name=r.name;
  w.items=r.items.map(i=>({id:uid(),exId:i.exId,ss:i.ss,sets:setsFor(i.exId,i.sets,w.id)}));
  S.active=w;save();openEditor(w,'active');
},
'new-routine':()=>openRoutineEditor(null),
'edit-routine':b=>openRoutineEditor(S.routines.find(x=>x.id===b.dataset.id)),
'ed-min':()=>{save();closeSheet();},
'ed-finish':()=>{
  const w=ed.w;cleanup(w);
  if(ed.mode==='active'){
    if(!w.items.length){S.active=null;save();closeSheet();toast('Empty workout discarded');return;}
    w.end=Date.now();if(!w.name.trim())w.name=autoName(w);
    const bw=Number(String(w.bw).replace(',','.'));if(bw>0)S.bw.push({t:w.start,v:bw});
    S.workouts.push(w);S.active=null;
    T.on=false;T.run=false;renderTimer();
  }
  save();closeSheet();
},
'ed-menu':()=>{
  const w=ed.w,active=ed.mode==='active';
  actionSheet('',[
    {label:'Save as routine',fn:()=>saveAsRoutine(w)},
    {label:active?'Discard workout':'Delete workout',danger:true,fn:()=>confirmBox(active?'Discard this workout?':'Delete this workout?',active?'Discard':'Delete',()=>{
      if(active)S.active=null;else S.workouts=S.workouts.filter(x=>x.id!==w.id);
      save();closeSheet();})}]);
},
'timer-toggle':()=>{if(T.on){T.on=false;T.run=false;renderTimer();}else{T.on=true;T.dur=S.rest;T.left=S.rest;T.run=false;T._announced=0;renderTimer();}},
'add-ex':()=>openPicker((ids,ss)=>addToWorkout(ids,ss)),
'set-add':b=>{
  const it=ed.w.items[+b.dataset.i],l=it.sets[it.sets.length-1];
  it.sets.push({w:l?l.w:'',r:l?l.r:'',done:false,drop:false});save();renderEditor();
},
'set-done':b=>{
  const it=ed.w.items[+b.dataset.i],s=it.sets[+b.dataset.s];
  s.done=!s.done;save();
  if(s.done)startRest();
  const n=it.sets.slice(0,+b.dataset.s+1).filter(x=>!x.drop).length;
  toast(s.done?'Set '+n+' done':'Set '+n+' undone');
  renderEditor();
},
'set-drop':b=>{
  const it=ed.w.items[+b.dataset.i],s=it.sets[+b.dataset.s];
  s.drop=!s.drop;save();renderEditor();
},
'ex-hist':b=>{
  const it=ed.w.items[+b.dataset.i],ss=sessions(it.exId).filter(x=>x.w.id!==ed.w.id).slice(0,6);
  openModal('<h3>'+esc(exName(it.exId))+'</h3>'+(ss.length?ss.map(x=>'<div class="hist"><span>'+fmtShort(x.w.start)+'</span><span>'+x.sets.map(s=>fmtN(s.w)+'×'+s.r).join(', ')+'</span></div>').join(''):'<p class="mut">No earlier sessions yet.</p>')+'<button class="btn" data-act="modal-close">Close</button>');
},
'ex-menu':b=>{
  const i=+b.dataset.i,w=ed.w,it=w.items[i];
  actionSheet(exName(it.exId),[
    {label:'Exercise history',fn:()=>ACT['ex-hist']({dataset:{i}})},
    {label:'Progression settings',fn:()=>openExSettings(it.exId)},
    {label:'Repeat last set ×N',fn:()=>{
      openModal('<h3>Repeat last set</h3><input class="fld" id="rp-n" type="text" inputmode="numeric" value="2" aria-label="Times"><button class="btn pri" data-act="rp-go" data-i="'+i+'">Repeat</button><button class="btn" data-act="modal-close">Cancel</button>');}},
    {label:'Remove last set',fn:()=>{if(it.sets.length>1){it.sets.pop();save();renderEditor();}else toast('An exercise needs at least one set');}},
    {label:'Move up',fn:()=>{if(i>0){[w.items[i-1],w.items[i]]=[w.items[i],w.items[i-1]];save();renderEditor();}}},
    {label:'Move down',fn:()=>{if(i<w.items.length-1){[w.items[i+1],w.items[i]]=[w.items[i],w.items[i+1]];save();renderEditor();}}},
    {label:'Remove exercise',danger:true,fn:()=>{w.items.splice(i,1);fixSS(w.items);save();renderEditor();}}]);
},
'rp-go':b=>{
  const n=Math.max(1,Math.min(20,parseInt($('#rp-n').value,10)||1)),it=ed.w.items[+b.dataset.i],l=it.sets[it.sets.length-1];
  closeModal();for(let k=0;k<n;k++)it.sets.push({w:l?l.w:'',r:l?l.r:'',done:false,drop:false});save();renderEditor();
},
'coach-go':()=>{tab='coach';renderTabs();renderView();const v=$('#view');v.setAttribute('aria-labelledby','tab-coach');scrollTo(0,0);},
'coach-settings':()=>{
  const c=coach();
  openModal('<h3>Coach settings</h3>'+
    '<label class="clbl">Default weight step ('+S.units+')</label><input class="fld" id="cs-inc" type="text" inputmode="decimal" value="'+(c.inc!=null?c.inc:'auto')+'">'+
    '<label class="clbl">Default rep range (low – high)</label><div class="inrow"><input class="fld" id="cs-lo" type="text" inputmode="numeric" value="'+(c.lo!=null?c.lo:'auto')+'"><input class="fld" id="cs-hi" type="text" inputmode="numeric" value="'+(c.hi!=null?c.hi:'auto')+'"></div>'+
    '<label class="clbl">Target sets per muscle group per week</label><input class="fld" id="cs-sets" type="text" inputmode="numeric" value="'+(c.setsPerWk||10)+'">'+
    '<label class="clbl">Deload reduction (%)</label><input class="fld" id="cs-pct" type="text" inputmode="decimal" value="'+(c.pct!=null?c.pct:10)+'">'+
    '<label class="clbl">Deload week length (days)</label><input class="fld" id="cs-days" type="text" inputmode="numeric" value="'+(c.dlDays||7)+'">'+
    '<p class="mut" style="margin:0">The coach compares every exercise with your recent sessions and suggests the next weight and reps. Double progression: hit the top of your rep range on every set, then add weight and drop back to the bottom of the range.</p>'+
    '<button class="btn pri" data-act="cs-save">Save</button>'+
    (Object.keys(S.prog||{}).length?'<button class="btn dng" data-act="cs-reset">Reset per-exercise settings</button>':'')+
    '<button class="btn" data-act="modal-close">Cancel</button>');
},
'cs-save':()=>{
  const c=coach();
  c.inc=parseAuto($('#cs-inc').value);c.lo=parseAuto($('#cs-lo').value);c.hi=parseAuto($('#cs-hi').value);
  const n=Number($('#cs-sets').value);c.setsPerWk=n>0?Math.min(60,Math.round(n)):10;
  const pv=Number($('#cs-pct').value);c.pct=isFinite(pv)&&pv>0?Math.min(50,Math.round(pv)):10;
  const dv=Number($('#cs-days').value);c.dlDays=isFinite(dv)&&dv>0?Math.min(21,Math.round(dv)):7;
  save();closeModal();renderView();toast('Coach settings saved');
},
'cs-reset':()=>{S.prog={};S.rng={};save();closeModal();renderView();toast('Per-exercise settings reset');},
'co-open':b=>{
  const id=b.dataset.id,a=coachAdvice(id);
  if(!a||a.state==='new'){toast('No history for this exercise');return;}
  const ex=exById(id)||{name:id,group:''};
  const hist=a.ses?a.ses.slice(0,6).map(s=>'<div class="hist"><span>'+fmtShort(s.t)+'</span><span>'+fmtN(s.w)+' '+esc(S.units)+' × '+s.r+' · '+s.n+' sets</span></div>').join(''):'';
  openModal('<h3>'+esc(ex.name)+'</h3>'+
    (a.state==='off'?'<div class="cobar"><span class="ct">Coach</span><span class="why">Suggestions are off for this exercise.</span></div>'
      :'<div class="cobar'+(a.state==='deload'?' dl':'')+'"><span class="ct">'+(a.state==='deload'?'Deload':a.state==='rebuild'?'Rebuild':'Next')+'</span><span class="cv">'+fmtN(a.w)+' '+esc(S.units)+' × '+a.r+'</span><span class="why">'+esc(a.why)+'</span></div>')+
    (hist?'<div style="margin-top:4px">'+hist+'</div>':'')+
    (S.active&&a.state!=='off'?'<button class="btn pri" data-act="co-use" data-id="'+esc(id)+'">Add to current workout</button>':'')+
    '<button class="btn" data-act="es-open" data-id="'+esc(id)+'">Progression settings</button>'+
    '<button class="btn" data-act="modal-close">Close</button>');
},
'co-use':b=>{
  const id=b.dataset.id,a=coachAdvice(id);
  if(!a||!a.w){toast('No target yet');return;}
  if(!S.active){toast('Start a workout first');return;}
  const n=Math.max(2,Math.min(6,a.ses&&a.ses[0]?a.ses[0].n:3));
  S.active.items.push({id:uid(),exId:id,ss:null,sets:Array.from({length:n},()=>({w:a.w,r:a.r,done:false,drop:false}))});
  save();closeModal();toast(exName(id)+' added to your workout');
},
'co-apply':b=>{
  const it=ed.w.items[+b.dataset.i],a=coachAdvice(it.exId,ed.w.id);
  if(!a||!a.w){toast('No suggestion yet');return;}
  let n=0;
  it.sets.forEach(s=>{if(!s.done){s.w=a.w;s.r=a.r;n++;}});
  if(!n){toast('Every set is already logged');return;}
  save();renderEditor();toast('Filled '+n+' set'+(n===1?'':'s')+' with '+fmtN(a.w)+' '+S.units+' × '+a.r);
},
'co-set':b=>{
  const it=ed.w.items[+b.dataset.i],s=it.sets[+b.dataset.s];
  const a=coachAdvice(it.exId,ed.w.id);
  if(!a||!a.w)return;
  s.w=a.w;s.r=a.r;save();renderEditor();
},
'es-open':b=>openExSettings(b.dataset.id),
'es-save':b=>{
  const id=b.dataset.id,o={mode:$('#es-mode').value};
  const inc=parseAuto($('#es-inc').value),lo=parseAuto($('#es-lo').value),hi=parseAuto($('#es-hi').value);
  if(inc!=null)o.inc=inc;
  if(lo!=null)o.lo=lo;
  if(hi!=null)o.hi=hi;
  S.prog[id]=o;save();closeModal();renderView();toast('Progression updated');
},
'dl-open':()=>{
  const di=deloadInfo();
  if(!di){
    const base=deloadBase(),pct=deloadPct();
    openModal('<h3>Deload week</h3>'+
      '<p class="mut" style="margin:0">A deload week drops your working weight so you can recover. Your deload weights come from last week\'s weights and stay the same for the whole week. When the week ends the coach takes you back to where you were and keeps pushing from there.</p>'+
      '<label class="clbl">Length (days)</label><input class="fld" id="dl-days" type="text" inputmode="numeric" value="'+deloadDays()+'">'+
      '<label class="clbl">Reduce weight by (%)</label><input class="fld" id="dl-pct" type="text" inputmode="decimal" value="'+pct+'">'+
      '<label class="clbl">Deload weights</label><div id="dl-preview">'+deloadRows(base,pct)+'</div>'+
      '<button class="btn pri" data-act="dl-start">Start deload week</button>'+
      '<button class="btn" data-act="modal-close">Cancel</button>');
    return;
  }
  if(di.active){
    openModal('<h3>Deload week</h3>'+
      '<p class="mut" style="margin:0">Running until '+fmtShort(di.d.end)+' · '+di.left+' day'+(di.left===1?'':'s')+' left. Every target is '+di.d.pct+'% lighter and starts at the bottom of your rep range.</p>'+
      deloadRows(di.d.base,di.d.pct)+
      '<button class="btn pri" data-act="dl-end">End the deload week</button>'+
      '<button class="btn dng" data-act="dl-remove">Remove the deload</button>'+
      '<button class="btn" data-act="modal-close">Close</button>');
    return;
  }
  openModal('<h3>Deload finished</h3>'+
    '<p class="mut" style="margin:0">'+di.back+' of '+di.total+' exercise'+(di.total===1?'':'s')+' are back at the weight you had before the deload. The coach keeps pushing from there.</p>'+
    deloadRows(di.d.base,di.d.pct)+
    '<button class="btn dng" data-act="dl-remove">Remove the deload</button>'+
    '<button class="btn" data-act="modal-close">Close</button>');
},
'dl-start':()=>{
  const days=Math.max(1,Math.min(21,parseInt($('#dl-days').value,10)||deloadDays()));
  const pv=Number($('#dl-pct').value);
  const pct=isFinite(pv)&&pv>0?Math.min(50,Math.round(pv)):deloadPct();
  const base=deloadBase();
  if(!Object.keys(base).length){toast('Log a few workouts first');return;}
  const start=Date.now();
  S.deload={start:start,end:start+days*DAY,days:days,pct:pct,base:base};
  save();closeModal();renderView();toast('Deload week started · '+Object.keys(base).length+' exercises');
},
'dl-end':()=>{
  if(!S.deload)return;
  S.deload.end=Date.now();
  save();closeModal();renderView();toast('Deload ended — back to your pre-deload level');
},
'dl-remove':()=>confirmBox('Remove the deload? Your deload workouts count as normal training again.','Remove deload',()=>{S.deload=null;save();closeModal();renderView();toast('Deload removed');}),
'modal-close':(b,e)=>{if(e.target===b||b.tagName==='BUTTON')closeModal();},
'menu-pick':b=>{const f=menuFns[+b.dataset.i];closeModal();if(f)f();},
'confirm-yes':()=>{const f=pendingConfirm;pendingConfirm=null;closeModal();if(f)f();},
'out-copy':()=>{
  const t=showText.cur.text;
  const fallback=()=>{const a=$('#out-text');a.select();try{document.execCommand('copy');toast('Copied');}catch(e){toast('Select the text and copy it');}};
  try{navigator.clipboard.writeText(t).then(()=>toast('Copied')).catch(fallback);}catch(e){fallback();}
},
'out-dl':()=>{
  const c=showText.cur;
  try{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([c.text],{type:c.mime}));a.download=c.file;document.body.appendChild(a);a.click();a.remove();toast('Download started');}catch(e){toast('Use Copy instead');}
},
't-play':()=>{
  ensureAudio();
  if(T.run){T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));T.run=false;}
  else{if(T.left===0){T.left=T.dur;T._announced=0;}T.end=Date.now()+T.left*1000;T.run=true;}
  renderTimer();
},
't-minus':()=>{if(T.run)T.end-=15000;else T.left=Math.max(0,T.left-15);if(T.run)T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));renderTimer();},
't-plus':()=>{if(T.run){T.end+=15000;T.left=Math.ceil((T.end-Date.now())/1000);}else T.left+=15;renderTimer();},
't-x':()=>{T.on=false;T.run=false;renderTimer();},
'pk-cancel':()=>closePicker(),
'pk-back':()=>{pk.group=null;renderPicker();},
'pk-group':b=>{pk.group=b.dataset.id;renderPicker();},
'pk-mode':b=>{pk.mode=b.dataset.v;if(pk.mode==='regular')pk.sel=[];renderPicker();},
'pk-ex':b=>{
  const id=b.dataset.id;
  if(pk.mode==='regular'){finishPick([id],false);return;}
  const i=pk.sel.indexOf(id);if(i>=0)pk.sel.splice(i,1);else pk.sel.push(id);renderPickerList();
},
'pk-add-ss':()=>finishPick(pk.sel.slice(),true),
'pk-new':()=>{
  openModal('<h3>New exercise</h3><input class="fld" id="nx-name" type="text" placeholder="Name" autocomplete="off"><select class="fld" id="nx-grp">'+GROUPS.map(g=>'<option'+(pk.group===g?' selected':'')+'>'+g+'</option>').join('')+'</select><button class="btn pri" data-act="nx-create">Create</button><button class="btn" data-act="modal-close">Cancel</button>');
},
'nx-create':()=>{
  const name=$('#nx-name').value.trim(),group=$('#nx-grp').value;
  if(!name){toast('Enter a name');return;}
  let ex=S.exercises.find(e=>e.name.toLowerCase()===name.toLowerCase());
  if(!ex){let id=slug(name)||uid();if(exById(id))id+='-'+uid();ex={id,name,group,custom:true};S.exercises.push(ex);save();}
  closeModal();
  if(pk.mode==='regular')finishPick([ex.id],false);
  else{if(!pk.sel.includes(ex.id))pk.sel.push(ex.id);renderPickerList();}
},
're-cancel':()=>closeSheet(),
're-save':()=>{
  const r=re.r;r.name=r.name.trim()||'Routine';
  const i=S.routines.findIndex(x=>x.id===r.id);
  if(i>=0)S.routines[i]=r;else S.routines.push(r);
  save();closeSheet();
},
're-sets':b=>{const it=re.r.items[+b.dataset.i];it.sets=Math.max(1,Math.min(20,it.sets+Number(b.dataset.d)));renderRoutineEditor();},
're-rm':b=>{re.r.items.splice(+b.dataset.i,1);fixSS(re.r.items);renderRoutineEditor();},
're-add':()=>openPicker((ids,ss)=>{
  const gid=(ss&&ids.length>1)?uid():null;
  ids.forEach(exId=>re.r.items.push({exId,sets:3,ss:gid}));renderRoutineEditor();}),
're-del':()=>confirmBox('Delete this routine?','Delete',()=>{S.routines=S.routines.filter(x=>x.id!==re.r.id);save();closeSheet();}),
'stat-range':b=>{statRange=Number(b.dataset.v);renderView();},
'show-pr':()=>{showAllPR=!showAllPR;renderView();},
'bw-add':()=>{
  const v=Number($('#bw-in').value.trim().replace(',','.'));
  if(!(v>0)){toast('Enter your weight');return;}
  S.bw.push({t:Date.now(),v});save();renderView();
},
'bw-rm':b=>{S.bw=S.bw.filter(x=>String(x.t)!==b.dataset.t);save();renderView();},
units:b=>{S.units=b.dataset.v;save();renderView();},
'export-csv':()=>showText('Export CSV',csvAll(),'rep-log-'+toLocalInput(Date.now()).slice(0,10)+'.csv','text/csv'),
'export-json':()=>showText('Backup',JSON.stringify(S),'rep-log-backup-'+toLocalInput(Date.now()).slice(0,10)+'.json','application/json'),
restore:()=>openModal('<h3>Restore from backup</h3><p class="mut" style="margin:0">Paste the backup text. This replaces everything on this device.</p><textarea class="out" id="rs-text" placeholder="Paste backup here"></textarea><button class="btn pri" data-act="restore-go">Restore</button><button class="btn" data-act="modal-close">Cancel</button>'),
'restore-go':()=>{
  try{
    const d=JSON.parse($('#rs-text').value);
    if(!d||!Array.isArray(d.workouts))throw new Error('bad');
    S=d;migrate();save();closeModal();tab='log';renderTabs();renderView();toast('Backup restored');
  }catch(e){toast('That does not look like a backup');}
},
wipe:()=>confirmBox('Delete all workouts, routines and settings?','Delete everything',()=>{
  S=null;migrate();S.workouts=[];S.routines=[];S.prog={};S.rng={};S.deload=null;S.coach={inc:null,lo:null,hi:null,setsPerWk:10,pct:10,dlDays:7};save();T.on=false;renderTimer();renderView();toast('All data deleted');})
};
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;
  const f=ACT[b.dataset.act];if(f)f(b,e);
});
document.addEventListener('keydown',e=>{
  if((e.key==='Enter'||e.key===' ')&&e.target.matches&&e.target.matches('.wk[data-act]')){e.preventDefault();e.target.click();}
  if(e.key==='Escape'){
    if(!$('#modal').hidden)closeModal();
    else if(pk)closePicker();
    else if(ed)closeSheet();
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(pk&&t.id==='pk-q'){pk.q=t.value;renderPickerList();return;}
  if(t.id==='dl-pct'){
    const pv=Number(t.value);
    const pct=isFinite(pv)&&pv>0?Math.min(50,Math.round(pv)):deloadPct();
    const el=$('#dl-preview');
    if(el)el.innerHTML=deloadRows(deloadBase(),pct);
    return;
  }
  if(ed){
    if(t.id==='f-name')ed.w.name=t.value;
    else if(t.id==='f-bw')ed.w.bw=t.value;
    else if(t.id==='f-notes'){ed.w.notes=t.value;t.style.height='auto';t.style.height=t.scrollHeight+'px';}
    else if(t.dataset&&t.dataset.f){
      const r=t.closest('.set');
      const item=ed&&r&&ed.w.items[+r.dataset.i];
      const set=item&&item.sets[+r.dataset.s];
      if(!set)return;
      const v=t.value.trim().replace(',','.');
      if(v==='')set[t.dataset.f]='';
      else if(!isNaN(Number(v)))set[t.dataset.f]=Number(v);
    }else return;
    saveSoon();
  }else if(re&&t.id==='r-name')re.r.name=t.value;
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(ed&&t.id==='f-start'){
    const v=new Date(t.value).getTime();
    if(!isNaN(v)){
      ed.w.start=v;
      if(ed.w.end&&ed.w.end<v)ed.w.end=v;
      const h=$('#ed-title');if(h)h.textContent=fmtShort(v);
      saveSoon();
    }else{
      t.value=toLocalInput(ed.w.start);
    }
  }
  else if(ed&&t.id==='f-end'){
    const v=new Date(t.value).getTime();
    ed.w.end=(isNaN(v)||v<ed.w.start)?null:v;
    if(ed.w.end===null)t.value='';
    saveSoon();
  }
  else if(t.id==='st-ex'){statEx=t.value;renderView();}
  else if(t.id==='rest-sel'){S.rest=Number(t.value);save();}
});
window.addEventListener('pagehide',()=>{clearTimeout(saveT);save();});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){clearTimeout(saveT);save();}
  if(!T.on||!T.run)return;
  T.left=Math.max(0,Math.ceil((T.end-Date.now())/1000));
  const d=$('#t-d');if(d)d.textContent=mmss(T.left);
  if(T.left===0){T.run=false;beep();renderTimer();}
  else announceTimer();
});

/* ---------- start ---------- */
S=load();
if(!S)S=defaults();
migrate();save();
renderTabs();
const _v=$('#view');_v.setAttribute('aria-labelledby','tab-'+tab);
renderView();renderTimer();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){navigator.serviceWorker.register('sw.js').catch(function(){});}
})();
</script>
</body></html>
